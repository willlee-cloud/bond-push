  .g-cyan{background:var(--grp-cyan);} .g-lgreen{background:var(--grp-lgreen);} .g-ygreen{background:var(--grp-ygreen);}

</head>

ing: 14px 20px; margin: 0 0 18px 0; box-shadow: var(--shadow);\n  }\n  .float-warning .tag {\n    display: inline-block; background: var(--amber); color: var(--amber-ink);\n    font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 4px; margin-right: 8px;\n  }\n  .float-warning p { margin: 4px 0 0; font-size: 13px; color: var(--amber-deep); line-height: 1.7; }\n  .float-warning b { color: var(--amber-ink); }\n\n  .btn-print {\n    margin-top: 16px; padding: 9px 20px; background: var(--amber); color: var(--amber-ink);\n    border: 1px solid var(--amber-line); border-radius: 9px; font-size: 14px; font-weight: 700;\n    cursor: pointer; transition: transform .1s ease, background .15s;\n  }\n  .btn-print:hover { background: #d29a24; }\n  .btn-print:active { transform: translateY(1px) scale(.985); }\n\n  /* 表格：与汇总看板一致 —— 固定布局 + 琥珀表头吸顶 + 数字等宽 */\n  .table-scroll { overflow-x: auto; }\n  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; margin-top: 2px; }\n  thead th {\n    background: var(--amber); color: var(--amber-ink); padding: 11px 8px; text-align: center;\n    border: 1px solid var(--amber-line); font-weight: 700; white-space: normal; line-height: 1.3;\n    position: sticky; top: 0; z-index: 3; font-size: 13px; box-shadow: 0 3px 6px -2px rgba(0,0,0,.18);\n  }\n  tbody td {\n    padding: 9px 8px; text-align: center; border: 1px solid var(--line);\n    font-family:\"JetBrains Mono\",\"SF Mono\",ui-monospace,monospace; font-variant-numeric: tabular-nums;\n    transition: background .12s ease; font-size: 13px;\n  }\n  .num { background: var(--num-bg); color: var(--num-ink); }\n  .cushion { background: var(--cush-bg); color: var(--cush); font-weight: 700; }\n  .stars { font-size: 12px; white-space: nowrap; }\n  .tier { background: #f7f9fb; font-weight: 700; color: #37474f; }\n  /* 评级色与汇总看板对齐 */\n  .r5 { color: #8a6310; font-weight: 800; }\n  .r4 { color: var(--up); font-weight: 800; }\n  .r3 { color: #5b8c5a; font-weight: 800; }\n  .r2 { color: #c2772e; font-weight: 800; }\n  .r1 { color: #9aa0aa; font-weight: 800; }\n\n  /* 十字高亮：与汇总看板一致（琥珀低饱和底 + 琥珀描边） */\n  tbody tr:hover td {\n    background: rgba(224,168,46,.16) !important;\n    box-shadow: inset 0 0 0 2px var(--amber);\n  }\n  table:has(tbody td:nth-child(1):hover) tbody td:nth-child(1),\n  table:has(tbody td:nth-child(1):hover) thead th:nth-child(1),\n  table:has(tbody td:nth-child(2):hover) tbody td:nth-child(2),\n  table:has(tbody td:nth-child(2):hover) thead th:nth-child(2),\n  table:has(tbody td:nth-child(3):hover) tbody td:nth-child(3),\n  table:has(tbody td:nth-child(3):hover) thead th:nth-child(3),\n  table:has(tbody td:nth-child(4):hover) tbody td:nth-child(4),\n  table:has(tbody td:nth-child(4):hover) thead th:nth-child(4),\n  table:has(tbody td:nth-child(5):hover) tbody td:nth-child(5),\n  table:has(tbody td:nth-child(5):hover) thead th:nth-child(5),\n  table:has(tbody td:nth-child(6):hover) tbody td:nth-child(6),\n  table:has(tbody td:nth-child(6):hover) thead th:nth-child(6),\n  table:has(tbody td:nth-child(7):hover) tbody td:nth-child(7),\n  table:has(tbody td:nth-child(7):hover) thead th:nth-child(7),\n  table:has(tbody td:nth-child(8):hover) tbody td:nth-child(8),\n  table:has(tbody td:nth-child(8):hover) thead th:nth-child(8) {\n    background: rgba(224,168,46,.16) !important;\n    box-shadow: inset 0 0 0 2px var(--amber);\n  }\n  table:has(tbody td:nth-child(1):hover) tbody tr:hover td:nth-child(1),\n  table:has(tbody td:nth-child(2):hover) tbody tr:hover td:nth-child(2),\n  table:has(tbody td:nth-child(3):hover) tbody tr:hover td:nth-child(3),\n  table:has(tbody td:nth-child(4):hover) tbody tr:hover td:nth-child(4),\n  table:has(tbody td:nth-child(5):hover) tbody tr:hover td:nth-child(5),\n  table:has(tbody td:nth-child(6):hover) tbody tr:hover td:nth-child(6),\n  table:has(tbody td:nth-child(7):hover) tbody tr:hover td:nth-child(7),\n  table:has(tbody td:nth-child(8):hover) tbody tr:hover td:nth-child(8) {\n    background: rgba(224,168,46,.26) !important;\n    box-shadow: inset 0 0 0 3px var(--amber);\n  }\n\n  /* 评级结论 */\n  .verdict { background: var(--amber-tint); border: 1px solid var(--amber-line); border-radius: 12px; padding: 18px 22px; }\n  .verdict .big-stars { font-size: 30px; color: var(--amber-deep); letter-spacing: 4px; }\n  .verdict .label { font-size: 20px; font-weight: 800; margin-left: 10px; }\n  .verdict .line { font-size: 14px; margin-top: 10px; color: var(--muted); line-height: 1.7; }\n  .verdict .line b { color: var(--ink); }\n\n  /* 注释说明 */\n  .notes h4 { margin: 18px 0 7px; font-size: 14px; font-weight: 800; color: var(--ink); padding-left: 11px; border-left: 4px solid var(--amber); }\n  .notes ul { margin: 4px 0 4px; padding-left: 20px; }\n  .notes li { font-size: 13px; line-height: 1.75; color: #4b5563; margin-bottom: 4px; }\n  .bench { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; margin-top: 8px; }\n  .bench th { background: var(--amber); color: var(--amber-ink); padding: 8px 10px; border: 1px solid var(--amber-line); text-align: left; font-weight: 700; }\n  .bench td { padding: 8px 10px; border: 1px solid var(--line); }\n\n  @media print {\n    body { background: #fff; padding: 0; }\n    .card { border: 1px solid var(--line); border-radius: 0; box-shadow: none; }\n    .btn-print { display: none; }\n  }\n  @media (max-width:600px){\n    .page-head h1 { font-size: 26px; }\n    .table-scroll table { min-width: 760px; }\n  }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"page-head\">\n    <div class=\"eyebrow\">可转债潜伏配债 · 量化测算</div>\n    <h1>{{BOARD_TITLE}}抢权配售 · {{stockName}}</h1>\n    <div class=\"sub\">参数可自定义 · 全档位自动演算 · 风险评级对标</div>\n  </div>\n\n  <div class=\"float-warning\">\n    <div><span class=\"tag\">流通规模提醒</span><b id=\"floatScaleTag\">—</b></div>\n    <p>可流通规模越小，上市越易被资金集中炒作推高、上市溢价空间越大；但对应波动与回撤风险也同步放大。小盘债需重点盯住炒作情绪与兑现时点，避免在情绪高点接盘。</p>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-h\">一、参数录入</div>\n    <div class=\"hint\">修改任意参数，下方测算结果与风险评级将实时联动刷新。带（可自定义）的为预期上市价，其余为标的公告数据。</div>\n    <div class=\"form-grid\">\n      <div class=\"field\"><label>股票代码</label><input id=\"code\" value=\"300815\"></div>\n      <div class=\"field\"><label>股票名称</label><input id=\"name\" value=\"玉禾田\"></div>\n      <div class=\"field\"><label>对应转债名称</label><input id=\"bondName\" value=\"玉禾转债\"></div>\n      <div class=\"field\"><label>标的当日收盘价（确权基准价）</label><input id=\"price\" type=\"number\" step=\"0.01\" value=\"16.35\"><span class=\"u\">元</span></div>\n      <div class=\"field\"><label>官方每股配售金额（4位小数）</label><input id=\"perShare\" type=\"number\" step=\"0.0001\" value=\"3.0969\"><span class=\"u\">元/股</span></div>\n      <div class=\"field\"><label>股权登记日</label><input id=\"regDate\" value=\"2026-07-28\"></div>\n      <div class=\"field\"><label>配债缴款日</label><input id=\"payDate\" value=\"2026-07-29\"></div>\n      <div class=\"field\"><label>转债发行总规模</label><input id=\"issueSize\" value=\"15.00\"><span class=\"u\">亿元</span></div>\n      <div class=\"field\"><label>转债信用评级</label><input id=\"rating\" value=\"AA\"></div>\n      <div class=\"field\"><label>正股最新转股价</label><input id=\"convPrice\" type=\"number\" step=\"0.01\" value=\"16.35\"><span class=\"u\">元</span></div>\n      <div class=\"field\"><label>转债预期上市价格（可自定义）</label><input id=\"listingPrice\" type=\"number\" step=\"0.1\" value=\"157.3\"><span class=\"u\">元（默认激进价，可手动改为保守价）</span></div>\n      <div class=\"field\" title=\"控股股东、实控人及其一致行动人（即使单个<5%只要属一致行动人也计入）合计持股数\"><label>锁定持股数</label><input id=\"lockShares\" type=\"number\" step=\"1\" value=\"171057001\"><span class=\"u\">股</span></div>\n      <div class=\"field\"><label>锁定股东配售参与比例</label><input id=\"lockRatio\" type=\"number\" step=\"1\" value=\"100\"><span class=\"u\">%（默认100，放弃则调低）</span></div>\n      <div class=\"field\"><label>转债可流通规模（自动倒推·不可改）</label><input id=\"floatScale\" type=\"number\" step=\"0.01\" readonly value=\"\"><span class=\"u\">亿元</span></div>\n    </div>\n    <div class=\"core-params\">\n      <div class=\"cp\"><div class=\"k\">单张转债盈利 = 上市价 − 100</div><div class=\"v num-tabular\" id=\"profitPerBond\">—</div></div>\n      <div class=\"cp\"><div class=\"k\">理论安全垫（满配·忽略碎面损耗）</div><div class=\"v num-tabular\" id=\"theoCushion\">—</div></div>\n      <div class=\"cp\"><div class=\"k\">制表日期</div><div class=\"v num-tabular\" id=\"tableDateValue\">—</div></div>\n    </div>\n    <button class=\"btn-print\" onclick=\"window.print()\">打印 / 导出 PDF</button>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-h\">二、全档位仓位测算</div>\n    <div id=\"calcError\" style=\"display:none; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; border-radius:6px; padding:10px 12px; margin-bottom:10px; font-size:13px;\"></div>\n    <div class=\"table-scroll\">\n      <table>\n        <colgroup><col style=\"width:9%\"><col style=\"width:14%\"><col style=\"width:12%\"><col style=\"width:12%\"><col style=\"width:12%\"><col style=\"width:11%\"><col style=\"width:15%\"><col style=\"width:15%\"></colgroup>\n        <thead>\n          <tr>\n            <th>股数档位</th>\n            <th>所需资金(正股)</th>\n            <th>理论获配</th>\n            <th>实际获配</th>\n            <th>预期盈利</th>\n            <th>安全垫</th>\n            <th>星级评级</th>\n            <th>该档评级</th>\n          </tr>\n        </thead>\n        <tbody id=\"tierBody\" class=\"num-tabular\"><tr><td colspan=\"8\" style=\"padding:24px;color:#9ca3af;text-align:center;\">正在计算档位数据，请稍候…</td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"hint\" style=\"margin-top:12px;\">\n      说明：深市配债按张计算，理论获配金额<b>向下取整百元</b>，舍去不足100元的零碎面值（不四舍五入、不进位）。\n      持仓体量越小，碎面损耗越高、实际安全垫越低。上表「实际获配」已套用该铁规。\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-h\">三、风险评级结论</div>\n    <div class=\"verdict\">\n      <div><span class=\"big-stars\" id=\"headlineStars\">—</span><span class=\"label\" id=\"headlineLabel\">—</span></div>\n      <div class=\"line\">基准安全垫（满配理论）：<b id=\"headlineCushion\">—</b> ｜ 评级阈值：≥9%★★★★★ ｜ 7–9%★★★★ ｜ 4–7%★★★ ｜ 2–4%★★ ｜ &lt;2%★</div>\n      <div class=\"line\">注：基准安全垫按「忽略碎面损耗」测算，代表大资金满配下的理想安全垫；小仓位实际安全垫见上表各档，会低于基准值。</div>\n    </div>\n  </div>\n\n  <div class=\"card notes\">\n    <div class=\"section-h\">四、注释说明</div>\n\n    <h4>核心策略模型</h4>\n    <ul>\n      <li>登记日潜伏买入正股 → 收盘确权获取转债配售权 → 缴款日清仓正股 → 持有转债上市套利。</li>\n    </ul>\n\n    <h4>标准交易执行策略</h4>\n    <ul>\n      <li><b>低风险潜伏打法（首选推荐）</b>：登记日前 3–5 天分批建底仓，不一次性满仓；股价上涨则减仓兑现浮盈、保留核心底仓锁定配债权、被动增厚安全垫；股价下跌则分批加仓摊薄成本、主动增厚安全垫；股权登记日收盘锁定最终持仓确保确权；配债缴款日开盘无条件清仓全部正股，仅保留转债等待上市套利。</li>\n      <li><b>短线尾盘突击打法（高风险）</b>：登记日尾盘 14:40–14:55 集中建仓，最小化资金占用时间；优势是资金闲置成本极低，劣势是无择时、摊成本空间，尾盘抢筹易抬高成本、压缩安全垫。</li>\n    </ul>\n\n    <h4>核心风控铁律（永久通用）</h4>\n    <ul>\n      <li>所有盈利、安全垫测算基于「自定义转债上市价格」，行情走弱/走强需手动调整参数重新演算风险。</li>\n      <li>深市零碎配债面值全部舍去，持仓体量越小，配售资金损耗越高。</li>\n      <li>抢权套利最大风险：缴款日套利资金集体兑现砸盘，单日踩踏下跌击穿安全垫。</li>\n      <li>配债为股东权利，确权后需<b>手动缴款</b>，未缴款自动放弃配售额度。</li>\n      <li>本策略为纯短线套利，正股不做中长期持有，杜绝趋势博弈。</li>\n    </ul>\n\n    <h4>五星风险评级体系（永久复用）</h4>\n    <ul>\n      <li>★★★★★ 极致优质：安全垫 ≥9%，小盘转债、潜伏窗口期充足、容错极高。</li>\n      <li>★★★★ 优质稳健：安全垫 7%–9%，性价比优异，适合主力重仓参与。</li>\n      <li>★★★ 中性博弈：安全垫 4%–7%，容错一般，仅适合小仓位试错。</li>\n      <li>★★ 风险偏弱：安全垫 2%–4%，回撤风险高，不建议常规参与。</li>\n      <li>★ 极致垃圾：安全垫 &lt;2%，极易总账亏损，直接放弃标的。</li>\n    </ul>\n\n    <h4>可流通规模倒推逻辑（永久复用 · 禁止瞎估）</h4>\n    <ul>\n      <li>规则依据：2023 年《证券发行与承销管理办法》修订后，原股东优先配售的可转债中，<b>持股 ≥5% 的股东、实际控制人及其一致行动人、董监高</b>参与配售的部分，自发行结束之日起 <b>6 个月内不得转让（锁定）</b>；其余持股 &lt;5% 且非一致行动人的原股东配售部分，以及网上/网下中签部分，上市首日即可全流通。</li>\n      <li>倒推公式：<b>锁定部分（亿元）= 锁定股东合计持股数 × 每股配售金额 × 大股东配售参与比例 ÷ 1 亿</b>；<b>可流通规模 = 发行总规模 − 锁定部分</b>。</li>\n      <li>锁定股东范围：控股股东 + 实际控制人 + 其一致行动人（即使单个持股 &lt;5%，只要属一致行动人也计入）。大股东若<b>放弃配售</b>，相应份额转网上发行、变为全流通，流通规模会显著变大——因此「大股东配不配债」是流通盘的核心变量。</li>\n      <li>本页「转债可流通规模」由上述公式<b>自动倒推、不接受手填</b>，确保每页数字都可回溯到公告披露的大股东持股与配售参与比例，杜绝主观乱估。</li>\n    </ul>\n\n    <h4>经典标的对标案例（固化参考 · 默认上市价 157.3）</h4>\n    <table class=\"bench\">\n      <thead><tr><th>标的</th><th>基准安全垫（默认157.3）</th><th>风险评级</th><th>核心优劣总结</th></tr></thead>\n      <tbody>\n        <tr><td>玉禾田（玉禾转债）</td><td>10%+</td><td>★★★★★</td><td>厚安全垫（10%+）、容错极高；但流通盘约 9.7 亿非迷你债，炒作弹性有限</td></tr>\n        <tr><td>丰茂股份（丰茂转债）</td><td>9%+</td><td>★★★★★</td><td>迷你债（流通约 1.5 亿）易爆炒、安全垫充足，当期最优套利标的</td></tr>\n        <tr><td>震裕科技（震裕转02）</td><td>4.2%左右</td><td>★★★</td><td>安全垫极薄、无潜伏窗口期、波动大，仅适合博弈型小仓位</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n</div>\n\n<script>\n  // —— 固定测算仓位档位（统一标准，无需自定义）——\n  const TIERS = [100,200,300,400,500,600,700,800,900,1000,2000,3000,4000];\n  const DEFAULT_LISTING = 157.3;\n\n  function ratingFor(c){\n    if (c >= 9) return { stars:'★★★★★', label:'极致优质', cls:'r5' };\n    if (c >= 7) return { stars:'★★★★',   label:'优质稳健', cls:'r4' };\n    if (c >= 4) return { stars:'★★★',    label:'中性博弈', cls:'r3' };\n    if (c >= 2) return { stars:'★★',     label:'风险偏弱', cls:'r2' };\n    return        { stars:'★',       label:'极致垃圾', cls:'r1' };\n  }\n  function fmt(n, d){\n    if (!isFinite(n)) return '—';\n    return Number(n).toLocaleString('zh-CN', { minimumFractionDigits:d, maximumFractionDigits:d });\n  }\n\n  function showError(msg){\n    const err = document.getElementById('calcError');\n    if (err) { err.textContent = '计算异常：' + msg; err.style.display = 'block'; }\n  }\n\n  // 核心公式（参数联动）\n  // 所需资金 = 持股数量 × 收盘价\n  // 理论获配 = 持股数量 × 每股配售金额\n  // 实际获配 = 沪市(60/688) FLOOR(理论获配 ÷ 1000) × 1000；深市(00/30) FLOOR(理论获配 ÷ 100) × 100\n  // 预期盈利 = (实际获配 ÷ 100) × (上市价 − 100)\n  // 安全垫   = 预期盈利 ÷ 所需资金 × 100%   （保留2位小数）\n  // 需要金额 = 正股所需资金 + 实际获配转债面值\n  function recompute(){\n    try {\n    const P  = parseFloat(document.getElementById('price').value) || 0;\n    const A  = parseFloat(document.getElementById('perShare').value) || 0;\n    const noScheme = !(A > 0);   // 方案未定（无每股配售）→ 获配/安全垫用横杠，不误导\n    const L  = parseFloat(document.getElementById('listingPrice').value) || DEFAULT_LISTING;\n    const profitPerBond = L - 100;\n\n    document.getElementById('profitPerBond').textContent = noScheme ? '—' : (fmt(profitPerBond, 1) + ' 元');\n\n    const tbody = document.getElementById('tierBody');\n    tbody.innerHTML = '';\n    TIERS.forEach(function(N){\n      const cost   = N * P;                       // 所需资金(正股)\n      const theo   = noScheme ? null : N * A;       // 理论获配\n      const codeEl = document.getElementById('code');\n      const isSH   = codeEl && String(codeEl.value)[0] === '6'; // 沪市(60/688)按手(1000)取整\n      const actual = noScheme ? null : (isSH ? Math.floor(theo / 1000) * 1000 : Math.floor(theo / 100) * 100); // 实际获配：沪市floor1000 / 深市floor100\n      const profit = noScheme ? null : (actual / 100) * profitPerBond; // 预期盈利\n      const cushion = (noScheme || cost <= 0) ? null : profit / cost * 100; // 安全垫%\n      const r = cushion == null ? null : ratingFor(cushion);\n      const tr = document.createElement('tr');\n      tr.innerHTML =\n        '<td class=\"tier\">' + N + '</td>' +\n        '<td class=\"num\">' + fmt(cost, 0) + '</td>' +\n        '<td class=\"num\">' + (noScheme ? '—' : fmt(theo, 2)) + '</td>' +\n        '<td class=\"num\">' + (noScheme ? '—' : fmt(actual, 0)) + '</td>' +\n        '<td class=\"num\">' + (noScheme ? '—' : fmt(profit, 2)) + '</td>' +\n        '<td class=\"cushion\">' + (noScheme ? '—' : fmt(cushion, 2) + '%') + '</td>' +\n        '<td class=\"stars ' + (r ? r.cls : '') + '\">' + (noScheme ? '—' : r.stars) + '</td>' +\n        '<td class=\"' + (r ? r.cls : '') + '\">' + (noScheme ? '—' : r.label) + '</td>';\n      tbody.appendChild(tr);\n    });\n\n    // 理论安全垫（满配·忽略碎面损耗）= 每股配售盈利 ÷ 每股股价，已是百分比\n    // 每股配售盈利 = (A/100) × 上市盈利；÷ 股价 P；×100%  ⇒  A × 上市盈利 ÷ P\n    const theoCushion = (P > 0 && A > 0) ? (A * profitPerBond) / P : null;\n    const head = noScheme ? null : ratingFor(theoCushion);\n    document.getElementById('theoCushion').textContent = noScheme ? '—' : fmt(theoCushion, 2) + '%';\n    document.getElementById('headlineStars').textContent = noScheme ? '—' : head.stars;\n    document.getElementById('headlineLabel').textContent = noScheme ? '方案未定' : head.label;\n    document.getElementById('headlineCushion').textContent = noScheme ? '—' : fmt(theoCushion, 2) + '%';\n\n    // 可流通规模倒推（底层逻辑：总规模 − 锁定股东优先配售锁定部分）\n    // 规则：2023《证券发行与承销管理办法》修订后，持股≥5%股东、实控人及其一致行动人、董监高\n    //       通过优先配售取得的可转债，发行结束日起 6 个月内不得转让（锁定）；其余原股东及网申中签上市首日全流通。\n    // 倒推公式：锁定部分(亿元) = 锁定股东合计持股数(股) × 每股配售(元/股) × 参与比例 ÷ 1e8\n    //           可流通规模      = 发行总规模 − 锁定部分\n    const issue      = parseFloat(document.getElementById('issueSize').value) || 0;\n    const lockShares = parseFloat(document.getElementById('lockShares').value) || 0;\n    const lockRatio  = parseFloat(document.getElementById('lockRatio').value) || 0;\n    const floatEl    = document.getElementById('floatScale');\n    if (lockShares > 0) {\n      const locked     = lockShares * A * (lockRatio / 100) / 1e8;   // 亿元\n      const floatScale = issue - locked;                            // 亿元（自动倒推，只读）\n      floatEl.value = fmt(floatScale, 2);\n      document.getElementById('floatScaleTag').textContent = floatScale > 0\n        ? ('本转债倒推可流通规模约 ' + fmt(floatScale, 2) + ' 亿元（总规模 ' + fmt(issue,2) + ' − 锁定 ' + fmt(locked,2) + '）')\n        : '（请填写锁定股东合计持股数）';\n    } else {\n      // 无锁定股东数据时保留生成器注入值，不瞎算\n      const current = parseFloat(floatEl.value) || 0;\n      if (!current) floatEl.value = '';\n      document.getElementById('floatScaleTag').textContent = current > 0\n        ? ('本转债可流通规模约 ' + fmt(current, 2) + ' 亿元')\n        : '（锁定股东持股数未提供，可流通规模待补）';\n    }\n    const err = document.getElementById('calcError');\n    if (err) err.style.display = 'none';\n  } catch (e) {\n    showError(e.message);\n  }\n}\n\n  document.querySelectorAll('input').forEach(function(i){ i.addEventListener('input', recompute); });\n\n  // 制表日期：生成时已写入则保留；打开时仍为占位符则补为当天，便于回溯\n  (function initDate(){\n    const d = document.getElementById('tableDateValue');\n    if (!d || d.textContent === '—' || !d.textContent.trim()) {\n      const t = new Date();\n      const p = function(n){ return String(n).padStart(2,'0'); };\n      d.textContent = t.getFullYear() + '-' + p(t.getMonth()+1) + '-' + p(t.getDate());\n    }\n  })();\n\n  // 计算入口：立即执行 + DOMReady + Load 三重保险，确保在各种预览环境都能渲染\n  function runCompute(){\n    try {\n      recompute();\n      console.log('[潜伏配债] 档位计算完成');\n    } catch(e) {\n      console.error('[潜伏配债] 计算异常:', e);\n      showError(e.message + '（请按 F12 查看控制台详情）');\n    }\n  }\n  runCompute();\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', runCompute);\n    window.addEventListener('load', runCompute);\n  } else {\n    // DOM 已就绪，但仍可能在 load 后某些资源加载导致重排，再补一次\n    runCompute();\n    if (document.readyState !== 'complete') {\n      window.addEventListener('load', runCompute);\n    }\n  }\n<\\/script>\n</body>\n</html>\n";

function compute(d){
  const contain = d.perShare / d.price * 100;         // 含权量(百元)
  const minShares = d.minShares || Math.ceil(100 / d.perShare / 100) * 100;
  const rtPrice = d.rtPrice != null ? d.rtPrice : d.price;
  const tableGain = (rtPrice - d.price) / d.price;
  const cushConsNum = d.optimalCushionCons || 0;
  const cushAggrNum = d.optimalCushionAggr || 0;
  const starsCons = cushConsNum>=0.09?5:cushConsNum>=0.07?4:cushConsNum>=0.04?3:cushConsNum>=0.02?2:1;
  const starsAggr = cushAggrNum>=0.09?5:cushAggrNum>=0.07?4:cushAggrNum>=0.04?3:cushAggrNum>=0.02?2:1;
  return {contain, minShares, rtPrice, tableGain, cushConsNum, cushAggrNum, starsCons, starsAggr,
          optimalShares:d.optimalShares||minShares, optimalCost:d.optimalCost||0,
          optimalTheo:d.optimalTheo||0, optimalActual:d.optimalActual||0};
}
function fmt(n,dp){ return Number(n).toFixed(dp); }
function rateClass(s){ return 'rate'+s; }

const STAGE_MAP = {
  '董事会预案':1,

};

};
function stageNum(s){ return STAGE_MAP[s] || s; }
function stageText(n){ return STAGE_LABELS[n] || n; }


function detailHtml(r){
  const noSch = !(r.perShare > 0);
  const rows = [
    ['转债名称', r.bond],
    ['行业概念', r.ind],
    ['板块', r.board],
    ['评级', r.rating],
    ['进度', r.stage],
    ['进度日期', r.progressDate || '—'],
    ['发行规模(亿)', fmt(r.issue,2)],
    ['可流通规模(亿)', (r.fs==null?'—':fmt(r.fs,2))],
    // —— 可流通规模推导区块（来自 API 前十大股东自动倒推，数字可回溯）——
    ...(function(){
      if (r.fs==null || !r.lockList || !r.lockList.length){
        return [['流通规模推导', r.lockDate ? ('锁定股东数据（'+r.lockDate+'）缺失，暂未倒推') : '方案未定 / 数据缺失，未倒推']];
      }
      const lockNames = r.lockList.map(x => x.name + (x.pct?('（'+x.pct+'%）'):'')).join('、');
      const base = (r.lockShares||'').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      const lockPart = (+r.lockShares * (r.perShare||0) / 1e8);
      const part = isFinite(lockPart) ? lockPart.toFixed(2) : '—';
      const txt = '锁定(' + (r.lockDate||'—') + ')：' + lockNames
        + ' ｜ 锁定持股 ' + (base||'—') + ' 股 × 每股配售 ' + fmt(r.perShare,1)
        + ' ÷1e8 = 锁定 ' + part + ' 亿 ｜ 可流通 = 发行 ' + fmt(r.issue,2) + ' − 锁定 ' + part + ' = ' + fmt(r.fs,2) + ' 亿';
      return [['流通规模推导', txt]];
    })(),
    ['转股价', fmt(r.conv,2)],
    ['制表价', fmt(r.price,2)],
    ['实时价', fmt(r.rtPrice,2)],
    ['加表后涨幅', fmt(r.tableGain*100,2)+'%'],
    ['每股配售', (r.perShare>0?fmt(r.perShare,1):'—')],
    ['最小配债(股)', r.minShares],
    ['最优股数', (noSch?'—':r.optimalShares)],
    ['所需金额', (noSch?'—':fmt(r.optimalCost,0))],
    ['理论配售额', (noSch?'—':fmt(r.optimalTheo,0))],
    ['实际配售额', (noSch?'—':fmt(r.optimalActual,0))],
    ['上市价保守', fmt(r.consPrice,1)],
    ['安全垫保守', (noSch?'—':fmt(r.cushConsNum*100,2)+'%')],
    ['上市价激进', fmt(r.aggrPrice,1)],
    ['安全垫激进', (noSch?'—':fmt(r.cushAggrNum*100,2)+'%')],
    ['含权量', (noSch?'—':fmt(r.contain,2))],
    ['登记日', r.reg],
    ['缴款日', r.pay]
  ];
  let h = '<div class="detail-grid">';
  for (const kv of rows){
    h += '<div class="detail-item"><span class="k">'+kv[0]+'</span><span class="v">'+kv[1]+'</span></div>';
  }
  return h + '</div>';
}
function toggleExpand(tr, r){
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains('detail-row')){
    nx.remove(); tr.classList.remove('row-expanded'); return;
  }
  const dr = document.createElement('tr');
  dr.className = 'detail-row';
  dr.innerHTML = '<td colspan="24">' + detailHtml(r) + '</td>';
  tr.classList.add('row-expanded');
  tr.parentNode.insertBefore(dr, tr.nextSibling);
}

function render(){
  const fs = document.getElementById('filterStage').value;
  const sort = document.getElementById('sortBy').value;
  let rows = DATA.map(d=>({...d, ...compute(d)}));
  rows = rows.filter(r => r.stage !== '已申购·待上市');
  if(fs){
    const n = parseInt(fs,10);
    rows = rows.filter(r => stageNum(r.stage) === n);
  }
  rows.sort((a,b)=>{
    if(sort==='cush') return b.cushConsNum-a.cushConsNum;
    if(sort==='cushAggr') return b.cushAggrNum-a.cushAggrNum;
    if(sort==='contain') return b.contain-a.contain;
    if(sort==='float'){ const av=a.fs==null?1e9:a.fs, bv=b.fs==null?1e9:b.fs; return av-bv; }
    if(sort==='gain') return b.tableGain-a.tableGain;
    if(sort==='reg') return a.reg<b.reg?-1:1;
    return 0;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML='';
  let order=0;
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const noScheme = !(r.perShare > 0);   // 方案未定（无每股配售）→ 派生列用横杠，不误导
        tr.innerHTML =
      '<td class="ind-col">'+r.ind.replace(/\//g, '/<wbr>')+'</td>'+
      '<td class="name-cell click" data-code="'+r.code+'">'+r.name+'</td>'+
      '<td class="click" data-code="'+r.code+'">'+r.code+'</td>'+
      '<td>'+r.board+'</td>'+
      '<td class="stage" title="'+r.stage+'">'+stageNum(r.stage)+'</td>'+
      '<td class="num">'+fmt(r.issue,2)+'</td>'+
      '<td class="num">'+(r.fs==null?'—':fmt(r.fs,2))+'</td>'+
      '<td class="num">'+fmt(r.conv,2)+'</td>'+
      '<td class="num">'+fmt(r.price,2)+'</td>'+
      '<td class="num">'+fmt(r.rtPrice,2)+'</td>'+
      '<td class="num '+(r.tableGain>=0?'rate4':'rate1')+'">'+fmt(r.tableGain*100,2)+'%</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.perShare,1))+'</td>'+
      '<td class="num" style="background:var(--amber-tint);font-weight:800;">'+(noScheme?'—':r.optimalShares)+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.optimalTheo,0))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.optimalActual,0))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.consPrice,1))+'</td>'+
      '<td class="cush">'+(noScheme?'—':(fmt(r.cushConsNum*100,2)+'% <span class="star-mark">'+'★'.repeat(r.starsCons)+'</span>'))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.aggrPrice,1))+'</td>'+
      '<td class="cush">'+(noScheme?'—':(fmt(r.cushAggrNum*100,2)+'% <span class="star-mark">'+'★'.repeat(r.starsAggr)+'</span>'))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.optimalCost,0))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.contain,2))+'</td>'+
      '<td>'+r.reg+'</td>'+
      '<td>'+(r.progressDate||'—')+'</td>'+
      '<td>'+(++order)+'</td>';
    tbody.appendChild(tr);
    tr.addEventListener('click', function(e){ if(e.target.classList.contains('click')) return; toggleExpand(tr, r); });
  });

  // 十字高亮
  const table = document.getElementById('board');
  table.querySelectorAll('tbody tr').forEach(tr=>{
    tr.addEventListener('mouseover', e=>{
      const cell = e.target.closest('td'); if(!cell) return;
      const idx = cell.cellIndex;
      tbody.querySelectorAll('td').forEach(c=>c.classList.remove('hl-row','hl-col'));
      tr.querySelectorAll('td').forEach(c=>c.classList.add('hl-row'));
      table.querySelectorAll('tbody tr').forEach(row=>{ const c=row.cells[idx]; if(c) c.classList.add('hl-col'); });
    });
    tr.addEventListener('mouseleave', ()=>{
      tbody.querySelectorAll('td').forEach(c=>c.classList.remove('hl-row','hl-col'));
    });
  });

  // 按潜伏配债 skill 模板即时生成单页并打开新标签
  const BOARD_TITLE_MAP = {'上海主板':'沪市主板','深圳主板':'深市主板','创业板':'深市创业板','科创板':'沪市科创板'};
  function openSingle(d){
    let h = TEMPLATE;
    // 标题明确沪市/深市 + 板块
    h = h.replace(/{{BOARD_TITLE}}/g, BOARD_TITLE_MAP[d.board] || d.board);
    h = h.replace(/{{stockName}}/g, d.name || '');
    // 参数填充：上市价默认采用激进价
    const map = {code:d.code, name:d.name, bondName:d.bond, price:d.price, perShare:d.perShare,
      regDate:d.reg, payDate:d.pay, issueSize:d.issue, rating:d.rating, convPrice:d.conv,
      listingPrice:d.aggrPrice || '157.3', lockShares:d.lockShares || '', lockRatio:'100',
      floatScale:(d.fs === null || d.fs === undefined || d.fs === '') ? '' : d.fs};
    for (const id in map){
      const re = new RegExp('<input id="'+id+'"[^>]*?value="[^"]*"', 'g');
      h = h.replace(re, '<input id="'+id+'" value="'+map[id]+'"');
    }
    h = h.replace(/id="tableDateValue">—</, 'id="tableDateValue">'+GEN_DATE+'<');

    // 预计算全档位结果并静态写入 HTML：打开即见，不依赖浏览器 JS 执行时机
    const TIERS = [100,200,300,400,500,600,700,800,900,1000,2000,3000,4000];
    function fmt(n, dp){
      if (!isFinite(n)) return '—';
      return Number(n).toLocaleString('zh-CN', { minimumFractionDigits:dp, maximumFractionDigits:dp });
    }
    function ratingFor(c){
      if (c >= 9) return { stars:'★★★★★', label:'极致优质', cls:'r5' };
      if (c >= 7) return { stars:'★★★★',   label:'优质稳健', cls:'r4' };
      if (c >= 4) return { stars:'★★★',    label:'中性博弈', cls:'r3' };
      if (c >= 2) return { stars:'★★',     label:'风险偏弱', cls:'r2' };
      return        { stars:'★',       label:'极致垃圾', cls:'r1' };
    }
    const P = parseFloat(d.price) || 0;
    const A = parseFloat(d.perShare) || 0;
    const noScheme = !(A > 0);   // 方案未定（无每股配售）→ 获配/安全垫用横杠，不误导
    const L = parseFloat(d.aggrPrice) || 157.3;
    const profitPerBond = L - 100;
    const theoCushion = (P > 0 && A > 0) ? (A * profitPerBond) / P : null;
    const head = noScheme ? null : ratingFor(theoCushion);
    h = h.replace(/id="profitPerBond">—</, 'id="profitPerBond">'+(noScheme?'—':fmt(profitPerBond,1)+' 元')+'<');
    h = h.replace(/id="theoCushion">—</, 'id="theoCushion">'+(noScheme?'—':fmt(theoCushion,2)+'%')+'<');
    h = h.replace(/id="headlineStars">—</, 'id="headlineStars">'+(noScheme?'—':head.stars)+'<');
    h = h.replace(/id="headlineLabel">—</, 'id="headlineLabel">'+(noScheme?'方案未定':head.label)+'<');
    h = h.replace(/id="headlineCushion">—</, 'id="headlineCushion">'+(noScheme?'—':fmt(theoCushion,2)+'%')+'<');
    let rowsHtml = '';
    TIERS.forEach(function(N){
      const cost = N * P;
      const theo = noScheme ? null : N * A;
      const actual = noScheme ? null : ((String(d.code)[0] === '6') ? Math.floor(theo / 1000) * 1000 : Math.floor(theo / 100) * 100); // 沪市按手(1000)取整，深市按张(100)取整
      const profit = noScheme ? null : (actual / 100) * profitPerBond;
      const cushion = (noScheme || cost <= 0) ? null : profit / cost * 100;
      const r = cushion == null ? null : ratingFor(cushion);
      rowsHtml +=
        '<tr>' +
        '<td class="tier">' + N + '</td>' +
        '<td class="num">' + fmt(cost, 0) + '</td>' +
        '<td class="num">' + (noScheme ? '—' : fmt(theo, 2)) + '</td>' +
        '<td class="num">' + (noScheme ? '—' : fmt(actual, 0)) + '</td>' +
        '<td class="num">' + (noScheme ? '—' : fmt(profit, 2)) + '</td>' +
        '<td class="cushion">' + (noScheme ? '—' : fmt(cushion, 2) + '%') + '</td>' +
        '<td class="stars ' + (r ? r.cls : '') + '">' + (noScheme ? '—' : r.stars) + '</td>' +
        '<td class="' + (r ? r.cls : '') + '">' + (noScheme ? '—' : r.label) + '</td>' +
        '</tr>';
    });
    h = h.replace(
      /<tbody id="tierBody" class="num-tabular">[\s\S]*?<\/tbody>/,
      '<tbody id="tierBody" class="num-tabular">' + rowsHtml + '</tbody>'
    );

    window.location.href = './bonds/' + String(d.name).replace(/[\/\\?:*<>|"\s]/g,'') + '.html';
  }

  // 点击代码联动生成单页（正式：按潜伏配债 skill 模板即时生成并打开新标签）
  tbody.querySelectorAll('.click').forEach(c=>{
    c.addEventListener('click', function(){
      const code = c.getAttribute('data-code');
      const d = BYCODE[code];
      if (d) openSingle(d);
    });
  });
}

document.getElementById('genDate').textContent = '制表日期 '+GEN_DATE;
const _pd = document.getElementById('priceDate'); if(_pd) _pd.textContent = '实时价 '+PRICE_DATE;
document.getElementById('filterStage').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);
render();

const avg = (DATA.reduce((s,d)=>s+(d.optimalCushionCons||0),0)/DATA.length*100).toFixed(2);
document.getElementById('foot').innerHTML =
  '共 '+DATA.length+' 只标的 ｜ 平均最优档保守安全垫 '+avg+'% ｜ 实时价截至 '+PRICE_DATE+'（腾讯自选股）｜ 上市价按保守/激进模型价估算，可在单页测算中自定义 ｜ 安全垫/含权量为理论值，小仓位因碎面损耗实际更低 ｜ 可流通规模=发行规模−锁定股东持股×每股配售÷1e8（持股≥5%/实控人/一致行动人 6 个月锁定）'
</script>
</body>
