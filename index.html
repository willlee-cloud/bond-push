<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="dns-prefetch" href="https://qt.gtimg.cn">

<title>可转债潜伏配债 · 汇总看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0a82e'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%233d2f00'%3E可%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --amber:#e0a82e; --amber-deep:#8a6310; --amber-tint:#fbf6ea; --amber-ink:#3d2f00; --amber-line:#d8b25a;
    --ink:#1f2430; --muted:#737a89; --line:#e9ebef; --bg:#f5f6f8; --surface:#ffffff;
    --num-bg:#f7f9fb; --num-ink:#2a3142;
    --cush:#1f7a5c; --cush-bg:#eef7f2;
    --up:#c0392b; --down:#2e8b57;
    --rate5:#8a6310; --rate4:#b58900; --rate3:#5b8c5a; --rate2:#c2772e; --rate1:#9aa0aa;
    --grp-green:#3f9d6b; --grp-blue:#3f7cc0; --grp-orange:#d68a2e; --grp-cyan:#2f9c92;
    --grp-lgreen:#7fae54; --grp-ygreen:#9cc06a; --grp-gray:#8593a1; --grp-purple:#9a6db5; --grp-red:#d05b50;
    /* 兼容内嵌单页模板 */
    --blue:#1565C0; --blue-tint:#E3F2FD; --purple:#7B1FA2; --purple-tint:#F3E5F5;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:"Manrope","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); margin:0; padding:18px 10px 48px; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:1680px; margin:0 auto; padding:0 4px;}
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:6px;}
  h1{font-size:36px; font-weight:800; letter-spacing:-.02em; margin:0; color:var(--ink); line-height:1.12; padding-left:18px; border-left:6px solid var(--amber);}
  .eyebrow{font-size:11.5px; letter-spacing:.2em; color:var(--amber-deep); font-weight:700; text-transform:uppercase; margin-bottom:10px;}
  .meta{font-size:13px; color:var(--muted); font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .sub{font-size:13px; color:var(--muted); margin:8px 0 18px; line-height:1.75; max-width:92ch;}
  .toolbar{display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-bottom:16px;}
  .toolbar select,.toolbar input{
    font-family:inherit; font-size:14px; padding:7px 11px; border:1px solid var(--line); border-radius:9px;
    background:var(--surface); color:var(--ink); transition:border-color .15s, box-shadow .15s; cursor:pointer;
  }
  .toolbar select:focus,.toolbar input:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(224,168,46,.16);}
  .toolbar label{font-size:13px; color:var(--muted); margin-left:6px;}
  .tab-group{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-left:2px;}
  .tab-group .tab-btn{font-family:inherit; font-size:14px; padding:7px 13px; background:var(--surface); color:var(--ink); border:none; border-right:1px solid var(--line); cursor:pointer; transition:background .15s,color .15s;}
  .tab-group .tab-btn:last-child{border-right:none;}
  .tab-group .tab-btn.active{background:var(--amber); color:var(--amber-ink); font-weight:700;}
  .tab-group .tab-btn:hover:not(.active){background:var(--amber-tint);}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 24px 48px -20px rgba(20,28,46,.10); padding:14px 10px; margin-bottom:20px; overflow:visible;
  }
  .scroll{overflow-x:auto;}
  /* 字号放大后，窄屏防御：保持桌面布局不变，仅手机端允许表格横向滚动，避免窄列挤压 */
  @media (max-width:600px){
    .card{overflow:hidden;}
    .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
    #board{min-width:1200px;}
    h1{font-size:26px;}
    .detail-grid{grid-template-columns:repeat(2, 1fr); gap:4px 16px;}
  }
  /* 桌面表格：容器撑满 + 表格至少 1520px（保持 22 列原比例，每列实际像素自然变大以容纳更大字号） */
  #board{min-width:1520px; width:100%;}
  table{border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed; font-size:14px;}
  thead{position:sticky; top:0; z-index:5;}
  thead th{
    background:var(--amber); color:var(--amber-ink); padding:12px 7px; text-align:center; border:1px solid var(--amber-line);
    font-weight:700; white-space:nowrap; position:sticky; top:0; z-index:3; letter-spacing:.02em; font-size:14px;
    box-shadow:0 3px 6px -2px rgba(0,0,0,.18);
  }
  tbody td{
    padding:10px 7px; text-align:center; border:1px solid var(--line); white-space:normal; font-size:14px; line-height:1.5;
    font-family:"JetBrains Mono","SF Mono",ui-monospace,"Cascadia Code",monospace; font-variant-numeric:tabular-nums;
  }
  tbody td.ind-col{font-family:inherit; white-space:normal; line-height:1.4; text-align:left; font-size:13.5px; color:var(--muted); overflow-wrap:anywhere; word-break:keep-all; padding:10px 6px;}
  tbody td.name-cell{font-family:inherit; font-weight:700; text-align:left; padding-left:11px;}
  tbody td.click{font-family:inherit;}
  tbody td.stage{font-family:inherit;}
  tbody td.bond-cell{font-family:inherit;}
  tbody tr{cursor:pointer; transition:background .14s ease;}
  tbody tr:hover{background:var(--amber-tint);}
  tbody tr.row-expanded{background:var(--amber-tint);}
  tbody tr.search-found td{background:#e8f4ff !important; font-weight:700 !important;}
  tbody tr.search-found:hover td{background:#d6ecff !important;}
  .grp td{border:none; padding:0; height:0;}
  .grp-row td{font-weight:800; color:#fff; padding:7px 12px; font-size:13.5px; letter-spacing:.04em; text-align:left; border:none;}
  .g-green{background:var(--grp-green);} .g-blue{background:var(--grp-blue);} .g-orange{background:var(--grp-orange);}
  .g-cyan{background:var(--grp-cyan);} .g-lgreen{background:var(--grp-lgreen);} .g-ygreen{background:var(--grp-ygreen);}
  .g-gray{background:var(--grp-gray);} .g-purple{background:var(--grp-purple);} .g-red{background:var(--grp-red);}
  .num{background:var(--num-bg); color:var(--num-ink);}
  .cush{background:var(--cush-bg); color:var(--cush); font-weight:700; text-align:center; line-height:1.35; padding:6px 2px;}
  .star-mark{font-size:11px; color:var(--amber-deep); letter-spacing:-1px;}
  .rate4{color:var(--up); font-weight:800;} .rate1{color:var(--down); font-weight:800;}
  /* 实时价变动闪烁：涨红、跌绿（A股习惯） */
  @keyframes cellFlashUp   { 0%{background:var(--num-bg);} 25%{background:rgba(214,48,49,.30);} 100%{background:var(--num-bg);} }
  @keyframes cellFlashDown { 0%{background:var(--num-bg);} 25%{background:rgba(27,153,79,.30);} 100%{background:var(--num-bg);} }
  .cell-flash-up   { animation: cellFlashUp   .9s ease-out; }
  .cell-flash-down { animation: cellFlashDown .9s ease-out; }
  .rate5{color:var(--rate5); font-weight:800;} .rate3{color:var(--rate3); font-weight:700;} .rate2{color:var(--rate2); font-weight:700;}
  .name-cell{font-weight:700;}
  .bond-cell{color:#5d5247; font-size:14px;}
  .stage{font-size:13.5px; color:var(--muted);}
  .click{cursor:pointer;}
  .click:hover{text-decoration:underline; color:var(--amber-deep);}
  tbody td.hl-row, tbody td.hl-col{background:rgba(224,168,46,.18); outline:1px solid var(--amber);}
  thead th.hl-col{background:#e8b84a !important;}
  .foot{font-size:13px; color:var(--muted); margin-top:16px; line-height:1.75;}
  .legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .legend span{font-size:12.5px; padding:2px 8px; border-radius:6px; color:#fff;}
  .star-mark{font-size:11.5px; color:var(--amber-deep);}
  .stage-legend{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
  .stage-legend-label{font-size:15px; font-weight:800; color:var(--ink);}
  .stage-item{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink);}
  .stage-num{display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; border-radius:50%; background:var(--amber); color:var(--amber-ink); font-weight:800; font-size:11.5px;}
  .detail-row td{background:#fafbfc; padding:0; border:none;}
  .detail-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px 30px; padding:18px 22px;}
  .detail-item{display:flex; justify-content:space-between; gap:12px; font-size:14.5px; padding:8px 0; border-bottom:1px solid #eef0f3;}
  .detail-item .k{color:var(--muted); white-space:nowrap;}
  .detail-item .v{font-weight:700; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums;}
  /* 已关注 N 天 · 展开明细右上角小角标（选项 B） */
  .detail-wrap{position:relative; padding-top:32px;}
  .detail-corner{position:absolute; top:6px; right:10px;}
  .watch-badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; line-height:1; white-space:nowrap; color:var(--amber-deep); background:var(--amber-tint); border:1px solid var(--amber-line); border-radius:999px; padding:6px 11px; box-shadow:0 2px 6px -2px rgba(138,99,16,.25);}
  .watch-badge .dot{width:6px; height:6px; border-radius:50%; background:var(--amber-deep); flex:none;}
  .watch-badge.empty{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="eyebrow">Convertible Bond · Latent Allocation</div>
      <h1>可转债潜伏配债 · 汇总看板</h1>
    </div>
  </div>
  <div class="toolbar">

    <label>搜索个股</label>
    <input type="text" id="searchInput" placeholder="代码或名称" style="width:130px;">
    <button id="searchBtn" type="button" style="font-family:inherit;font-size:14px;padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:var(--amber);color:var(--amber-ink);font-weight:700;cursor:pointer;transition:filter .15s;">搜索</button>
    <div class="tab-group" id="viewTabs">
      <button type="button" class="tab-btn active" data-mode="pending">待发转债</button>

  </div>

  <div class="stage-legend">
    <span class="stage-legend-label">进度说明：</span>
    <div class="stage-item"><span class="stage-num">1</span>董事会预案</div>
    <div class="stage-item"><span class="stage-num">2</span>股东大会通过</div>
    <div class="stage-item"><span class="stage-num">3</span>交易所受理</div>
    <div class="stage-item"><span class="stage-num">4</span>上市委通过（过会）</div>
    <div class="stage-item"><span class="stage-num">5</span>同意注册（已获批）</div>
    <div class="stage-item"><span class="stage-num">6</span>公告</div>
  </div>

  <div class="card">
    <div class="scroll">
      <table id="board">
        <colgroup>
          <col style="width:6.5%"><col style="width:5.5%"><col style="width:5%"><col style="width:6%"><col style="width:4%">
          <col style="width:4%"><col style="width:4%"><col style="width:4%"><col style="width:4%"><col style="width:4%">
          <col style="width:5.5%"><col style="width:3.5%"><col style="width:4%"><col style="width:4%"><col style="width:4%">
          <col style="width:4%"><col style="width:4.5%"><col style="width:4%"><col style="width:6%"><col style="width:3.5%">
          <col style="width:4%"><col style="width:4.5%"><col style="width:4.5%"><col style="width:3%">
        </colgroup>
        <thead>
          <tr>
            <th>行业概念</th><th>名称</th><th>代码</th><th>板块</th><th>进度</th>
            <th>规模</th><th>流通<br>规模</th><th>转股价</th><th>制表价</th><th>实时价</th>
            <th>加表<br>涨幅</th><th>每股<br>配售</th><th>最优<br>股数</th><th>配售<br>金额</th><th>实际<br>配售额</th>
            <th>上市价<br>保守</th><th>安全垫<br>保守</th><th>上市价<br>激进</th><th>安全垫<br>激进</th>
            <th>需要<br>金额</th><th>含权量</th><th>登记日</th><th>进度日</th><th>排序</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
      </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const LISTING = 157.3;
const PRICE_DATE = '2026-09-03';
const GEN_DATE = '2026-09-03';
const TEMPLATE = "<!DOCTYPE html>\r\n<html lang=\"zh-CN\">\r\n<head>\r\n  <link rel=\"dns-prefetch\" href=\"https://qt.gtimg.cn\">\r\n  <link rel=\"dns-prefetch\" href=\"https://push2.eastmoney.com\">\r\n<meta charset=\"UTF-8\">\r\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n<title>可转债潜伏配债量化测算</title>\r\n<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0a82e'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%233d2f00'%3E可%3C/text%3E%3C/svg%3E\">\r\n<style>\r\n  * { box-sizing: border-box; }\r\n  :root {\r\n    /* 与汇总看板统一的设计令牌 */\r\n    --amber:#e0a82e; --amber-deep:#8a6310; --amber-tint:#fbf6ea; --amber-ink:#3d2f00; --amber-line:#d8b25a;\r\n    --ink:#1f2430; --muted:#737a89; --line:#e9ebef; --bg:#f5f6f8; --surface:#ffffff;\r\n    --num-bg:#f7f9fb; --num-ink:#2a3142;\r\n    --cush:#1f7a5c; --cush-bg:#eef7f2;\r\n    --up:#c0392b;\r\n    --radius:16px;\r\n    --shadow:0 24px 48px -20px rgba(20,28,46,.10);\r\n  }\r\n  body {\r\n    font-family:\"Manrope\",\"PingFang SC\",\"Microsoft YaHei\",\"Hiragino Sans GB\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\r\n    margin: 0; padding: 26px 20px 56px; background: var(--bg); color: var(--ink);\r\n    -webkit-font-smoothing: antialiased; text-rendering:optimizeLegibility;\r\n    -webkit-print-color-adjust: exact; print-color-adjust: exact;\r\n  }\r\n  .wrap { max-width: 1080px; margin: 0 auto; }\r\n  .num-tabular { font-variant-numeric: tabular-nums; font-family:\"JetBrains Mono\",\"SF Mono\",ui-monospace,monospace; }\r\n\r\n  /* 与汇总看板一致的标题：左对齐 + 琥珀左边框（无黄色色块、无居中套路） */\r\n  .page-head { position: relative; margin-bottom: 22px; }\r\n  .page-head h1 {\r\n    font-size: 36px; font-weight: 800; letter-spacing: -.02em; color: var(--ink);\r\n    margin: 0; line-height: 1.12; padding-left: 18px; border-left: 6px solid var(--amber);\r\n  }\r\n  .page-head .eyebrow {\r\n    font-size: 11.5px; letter-spacing: .2em; color: var(--amber-deep); font-weight: 700;\r\n    text-transform: uppercase; margin-bottom: 10px;\r\n  }\r\n  .page-head .sub { font-size: 13px; color: var(--muted); margin: 10px 0 0 18px; line-height: 1.7; }\r\n\r\n  /* 实时价状态徽标：交易时段每 8s 刷一次显示最新抓取价，停止更新/非交易时段显灰 */\r\n  .live-status {\r\n    display: inline-flex; align-items: center; gap: 6px;\r\n    font-size: 12px; font-weight: 600; line-height: 1;\r\n    color: var(--amber-deep); background: var(--amber-tint);\r\n    border: 1px solid var(--amber-line); border-radius: 999px;\r\n    padding: 5px 10px; margin-bottom: 8px;\r\n  }\r\n  .live-status .dot { width: 7px; height: 7px; border-radius: 50%; background: #2bb55d; box-shadow: 0 0 0 3px rgba(43,181,93,.18); animation: livePulse 1.6s ease-in-out infinite; flex: none; }\r\n  .live-status.idle .dot { background: #9aa0aa; box-shadow: none; animation: none; }\r\n  .live-status.err  .dot { background: #c0392b; box-shadow: 0 0 0 3px rgba(192,57,43,.18); animation: none; }\r\n  /* 实时价变动闪烁：涨红、跌绿（A股习惯） */\r\n  @keyframes flashUp   { 0%{box-shadow:0 0 0 0 rgba(214,48,49,0);} 22%{box-shadow:0 0 0 3px rgba(214,48,49,.40);} 100%{box-shadow:0 0 0 0 rgba(214,48,49,0);} }\r\n  @keyframes flashDown { 0%{box-shadow:0 0 0 0 rgba(27,153,79,0);} 22%{box-shadow:0 0 0 3px rgba(27,153,79,.40);} 100%{box-shadow:0 0 0 0 rgba(27,153,79,0);} }\r\n  .price-row.flash-up   { animation: flashUp   .9s ease-out; border-radius: 8px; }\r\n  .price-row.flash-down { animation: flashDown .9s ease-out; border-radius: 8px; }\r\n  @keyframes livePulse { 0%,100%{ opacity: 1; } 50%{ opacity: .35; } }\r\n\r\n  /* 单元 cell 短暂高亮：每次重算后被改动 cell flash 一次（配 input 监听，让人确认\"它确实算过了\"）*/\r\n  tbody td.flash {\r\n    animation: cellFlash .9s ease-out;\r\n  }\r\n  @keyframes cellFlash {\r\n    0%   { background: rgba(43,181,93,.32); }\r\n    100% { background: inherit; }\r\n  }\r\n  tbody td.cushion.flash { animation: cushionFlash .9s ease-out; }\r\n  @keyframes cushionFlash {\r\n    0%   { background: rgba(224,168,46,.45); box-shadow: inset 0 0 0 2px #e0a82e; }\r\n    100% { background: var(--cush-bg); box-shadow: none; }\r\n  }\r\n\r\n  /* 已关注 N 天 · 右上角小角标（选项 B）：从「加表日期」算到今天 */\r\n  .watch-badge {\r\n    position: absolute; top: 2px; right: 0;\r\n    display: inline-flex; align-items: center; gap: 5px;\r\n    font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap;\r\n    color: var(--amber-deep); background: var(--amber-tint);\r\n    border: 1px solid var(--amber-line); border-radius: 999px;\r\n    padding: 6px 11px; box-shadow: 0 2px 6px -2px rgba(138,99,16,.25);\r\n  }\r\n  .watch-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber-deep); flex: none; }\r\n  .watch-badge.empty { display: none; }\r\n  @media (max-width:600px){\r\n    .watch-badge { position: static; display: inline-flex; margin-top: 12px; }\r\n  }\r\n\r\n  .card {\r\n    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);\r\n    padding: 18px 22px 22px; margin-bottom: 20px; box-shadow: var(--shadow);\r\n  }\r\n  /* 小节标题：与 h1 同构的琥珀左边框（去色块化，弱化 AI 套路） */\r\n  .section-h {\r\n    display: block; font-size: 15px; font-weight: 800; color: var(--ink);\r\n    padding: 2px 0 2px 11px; border-left: 4px solid var(--amber); margin: 2px 0 14px;\r\n  }\r\n  .hint { font-size: 12.5px; color: var(--muted); margin: -8px 0 14px; line-height: 1.65; }\r\n  .hint b { color: var(--ink); }\r\n\r\n  /* 参数录入网格：标签在上、输入在下 */\r\n  .form-grid {\r\n    display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px;\r\n  }\r\n  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }\r\n  .field .u { color: #9ca3af; font-size: 11px; margin-left: 3px; }\r\n  .field input {\r\n    width: 100%; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 9px;\r\n    font-size: 14px; font-family: inherit; background: #fff ground .15s;\r\n  }\r\n  .btn-print:hover { background: #d29a24; }\r\n  .btn-print:active { transform: translateY(1px) scale(.985); }\r\n\r\n  /* 立即重算：白底琥珀描边，与打印按钮成对（一手→一键重算；兜底用，永不出错） */\r\n  .btn-recompute {\r\n    margin-top: 16px; margin-right: 10px; padding: 9px 20px; background: #fff;\r\n    color: var(--amber-deep); border: 1px solid var(--amber-line); border-radius: 9px;\r\n    font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .1s ease, background .15s;\r\n  }\r\n  .btn-recompute:hover { background: var(--amber-tint); }\r\n  .btn-recompute:active { transform: translateY(1px) scale(.985); }\r\n\r\n  /* 表格：与汇总看板一致 —— 固定布局 + 琥珀表头吸顶 + 数字等宽 */\r\n  .table-scroll { overflow-x: auto; }\r\n  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; margin-top: 2px; }\r\n  thead th {\r\n    background: var(--amber); color: var(--amber-ink); padding: 11px 8px; text-align: center;\r\n    border: 1px solid var(--amber-line); font-weight: 700; white-space: normal; line-height: 1.3;\r\n    position: sticky; top: 0; z-index: 3; font-size: 13px; box-shadow: 0 3px 6px -2px rgba(0,0,0,.18);\r\n  }\r\n  tbody td {\r\n    padding: 9px 8px; text-align: center; border: 1px solid var(--line);\r\n    font-family:\"JetBrains Mono\",\"SF Mono\",ui-monospace,monospace; font-variant-numeric: tabular-nums;\r\n    transition: background .12s ease; font-size: 13px;\r\n  }\r\n  .num { background: var(--num-bg); color: var(--num-ink); }\r\n  .cushion { background: var(--cush-bg); color: var(--cush); font-weight: 700; }\r\n  .stars { font-size: 12px; white-space: nowrap; }\r\n  .tier { background: #f7f9fb; font-weight: 700; color: #37474f; }\r\n  /* 评级色与汇总看板对齐 */\r\n  .r5 { color: #8a6310; font-weight: 800; }\r\n  .r4 { color: var(--up); font-weight: 800; }\r\n  .r3 { color: #5b8c5a; font-weight: 800; }\r\n  .r2 { color: #c2772e; font-weight: 800; }\r\n  .r1 { color: #9aa0aa; font-weight: 800; }\r\n\r\n  /* 十字高亮：与汇总看板一致（琥珀低饱和底 + 琥珀描边） */\r\n  tbody tr:hover td {\r\n    background: rgba(224,168,46,.16) !important;\r\n    box-shadow: inset 0 0 0 2px var(--amber);\r\n  }\r\n  table:has(tbody td:nth-child(1):hover) tbody td:nth-child(1),\r\n  table:has(tbody td:nth-child(1):hover) thead th:nth-child(1),\r\n  table:has(tbody td:nth-child(2):hover) tbody td:nth-child(2),\r\n  table:has(tbody td:nth-child(2):hover) thead th:nth-child(2),\r\n  table:has(tbody td:nth-child(3):hover) tbody td:nth-child(3),\r\n  table:has(tbody td:nth-child(3):hover) thead th:nth-child(3),\r\n  table:has(tbody td:nth-child(4):hover) tbody td:nth-child(4),\r\n  table:has(tbody td:nth-child(4):hover) thead th:nth-child(4),\r\n  table:has(tbody td:nth-child(5):hover) tbody td:nth-child(5),\r\n  table:has(tbody td:nth-child(5):hover) thead th:nth-child(5),\r\n  table:has(tbody td:nth-child(6):hover) tbody td:nth-child(6),\r\n  table:has(tbody td:nth-child(6):hover) thead th:nth-child(6),\r\n  table:has(tbody td:nth-child(7):hover) tbody td:nth-child(7),\r\n  table:has(tbody td:nth-child(7):hover) thead th:nth-child(7),\r\n  table:has(tbody td:nth-child(8):hover) tbody td:nth-child(8),\r\n  table:has(tbody td:nth-child(8):hover) thead th:nth-child(8) {\r\n    background: rgba(224,168,46,.16) !important;\r\n    box-shadow: inset 0 0 0 2px var(--amber);\r\n  }\r\n  table:has(tbody td:nth-child(1):hover) tbody tr:hover td:nth-child(1),\r\n  table:has(tbody td:nth-child(2):hover) tbody tr:hover td:nth-child(2),\r\n  table:has(tbody td:nth-child(3):hover) tbody tr:hover td:nth-child(3),\r\n  table:has(tbody td:nth-child(4):hover) tbody tr:hover td:nth-child(4),\r\n  table:has(tbody td:nth-child(5):hover) tbody tr:hover td:nth-child(5),\r\n  table:has(tbody td:nth-child(6):hover) tbody tr:hover td:nth-child(6),\r\n  table:has(tbody td:nth-child(7):hover) tbody tr:hover td:nth-child(7),\r\n  table:has(tbody td:nth-child(8):hover) tbody tr:hover td:nth-child(8) {\r\n    background: rgba(224,168,46,.26) !important;\r\n    box-shadow: inset 0 0 0 3px var(--amber);\r\n  }\r\n\r\n  /* 评级结论 */\r\n  .verdict { background: var(--amber-tint); border: 1px solid var(--amber-line); border-radius: 12px; padding: 18px 22px; }\r\n  .verdict .big-stars { font-size: 30px; color: var(--amber-deep); letter-spacing: 4px; }\r\n  .verdict .label { font-size: 20px; font-weight: 800; margin-left: 10px; }\r\n  .verdict .line { font-size: 14px; margin-top: 10px; color: var(--muted); line-height: 1.7; }\r\n  .verdict .line b { color: var(--ink); }\r\n\r\n  /* 注释说明 */\r\n  .notes h4 { margin: 18px 0 7px; font-size: 14px; font-weight: 800; color: var(--ink); padding-left: 11px; border-left: 4px solid var(--amber); }\r\n  .notes ul { margin: 4px 0 4px; padding-left: 20px; }\r\n  .notes li { font-size: 13px; line-height: 1.75; color: #4b5563; margin-bottom: 4px; }\r\n  .bench { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; margin-top: 8px; }\r\n  .bench th { background: var(--amber); color: var(--amber-ink); padding: 8px 10px; border: 1px solid var(--amber-line); text-align: left; font-weight: 700; }\r\n  .bench td { padding: 8px 10px; border: 1px solid var(--line); }\r\n\r\n  @media print {\r\n    body { background: #fff; padding: 0; }\r\n    .card { border: 1px solid var(--line); border-radius: 0; box-shadow: none; }\r\n    .btn-print { display: none; }\r\n  }\r\n  @media (max-width:600px){\r\n    .page-head h1 { font-size: 26px; }\r\n    .table-scroll table { min-width: 760px; }\r\n  }\r\n</style>\r\n</head>\r\n<body>\r\n<div class=\"wrap\">\r\n\r\n  <div class=\"page-head\">\r\n    <div class=\"eyebrow\">可转债潜伏配债 · 量化测算</div>\r\n    <h1>{{BOARD_TITLE}}抢权配售 · {{stockName}}</h1>\r\n    <div class=\"sub\">参数可自定义 · 全档位自动演算 · 风险评级对标</div>\r\n    <div class=\"watch-badge empty\" id=\"watchBadge\"><span class=\"dot\"></span><span id=\"watchBadgeText\">已关注 — 天</span></div>\r\n  </div>\r\n\r\n  <div class=\"card\">\r\n    <div class=\"section-h\">一、参数录入</div>\r\n    <div class=\"hint\">修改任意参数，下方测算结果与风险评级将实时联动刷新。带（可自定义）的为预期上市价，其余为标的公告数据。</div>\r\n    <div class=\"live-status idle\" id=\"liveStatus\" title=\"交易时段 09:15–11:30 / 13:00–15:00 每 3s 自动刷新（腾讯 qt.gtimg 主源 + 东财 push2 兜底）\"><span class=\"dot\"></span><span id=\"liveStatusText\">实时价 · 正在连接行情源</span></div>\r\n    <div class=\"form-grid\">\r\n      <div class=\"field\"><label>股票代码</label><input id=\"code\" value=\"300815\"></div>\r\n      <div class=\"field\"><label>股票名称</label><input id=\"name\" value=\"玉禾田\"></div>\r\n      <div class=\"field\"><label>对应转债名称</label><input id=\"bondName\" value=\"玉禾转债\"></div>\r\n      <div class=\"field\">\r\n        <label>标的当日收盘价（确权基准价）<span class=\"mode-badge auto\" id=\"priceModeBadge\" title=\"点击切换：自动=实时价驱动，手动=你手填价测算\">自动</span></label>\r\n        <div class=\"price-row\">\r\n          <input id=\"price\" type=\"number\" step=\"0.01\" value=\"16.35\" data-mode=\"auto\">\r\n          <span class=\"u\">元</span>\r\n          <span class=\"live-tick\" id=\"priceLiveTick\">—</span>\r\n        </div>\r\n      </div>\r\n      <div class=\"field\"><label>官方每股配售金额（4位小数）</label><input id=\"perShare\" type=\"number\" step=\"0.0001\" value=\"3.0969\"><span class=\"u\">元/股</span></div>\r\n      <div class=\"field\"><label>加表日期</label><input id=\"addDate\" value=\"\" placeholder=\"YYYY-MM-DD\"></div>\r\n      <div class=\"field\"><label>股权登记日</label><input id=\"regDate\" value=\"2026-07-28\"></div>\r\n      <div class=\"field\"><label>配债缴款日</label><input id=\"payDate\" value=\"2026-07-29\"></div>\r\n      <div class=\"field\"><label>转债发行总规模</label><input id=\"issueSize\" value=\"15.00\"><span class=\"u\">亿元</span></div>\r\n      <div class=\"field\"><label>转债信用评级</label><input id=\"rating\" value=\"AA\"></div>\r\n      <div class=\"field\"><label>正股最新转股价</label><input id=\"convPrice\" type=\"number\" step=\"0.01\" value=\"16.35\"><span class=\"u\">元</span></div>\r\n      <div class=\"field\"><label>转债预期上市价格（可自定义）</label><input id=\"listingPrice\" type=\"number\" step=\"0.1\" value=\"157.3\"><span class=\"u\">元（默认激进价，可手动改为保守价）</span></div>\r\n      <div class=\"field\" title=\"控股股东、实控人及其一致行动人（即使单个<5%只要属一致行动人也计入）合计持股数\"><label>锁定持股数</label><input id=\"lockShares\" type=\"number\" step=\"1\" value=\"171057001\"><span class=\"u\">股</span></div>\r\n      <div class=\"field\"><label>锁定股东配售参与比例</label><input id=\"lockRatio\" type=\"number\" step=\"1\" value=\"100\"><span class=\"u\">%（默认100，放弃则调低）</span></div>\r\n      <div class=\"field\"><label>转债可流通规模（自动倒推·不可改）</label><input id=\"floatScale\" type=\"number\" step=\"0.01\" readonly value=\"\"><span class=\"u\">亿元</span></div>\r\n    </div>\r\n    <div class=\"core-params\">\r\n      <div class=\"cp\"><div class=\"k\">单张转债盈利 = 上市价 − 100</div><div class=\"v num-tabular\" id=\"profitPerBond\">—</div></div>\r\n      <div class=\"cp\"><div class=\"k\">理论安全垫（满配·忽略碎面损耗）</div><div class=\"v num-tabular\" id=\"theoCushion\">—</div></div>\r\n      <div class=\"cp\"><div class=\"k\">制表日期</div><div class=\"v num-tabular\" id=\"tableDateValue\">—</div></div>\r\n    </div>\r\n    <button class=\"btn-recompute\" onclick=\"recompute(true)\" type=\"button\">立即重算</button>\r\n    <button class=\"btn-print\" onclick=\"window.print()\" type=\"button\">打印 / 导出 PDF</button>\r\n  </div>\r\n\r\n  <div class=\"card\">\r\n    <div class=\"section-h\">二、全档位仓位测算</div>\r\n    <div id=\"calcError\" style=\"display:none; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; border-radius:6px; padding:10px 12px; margin-bottom:10px; font-size:13px;\"></div>\r\n    <div class=\"table-scroll\">\r\n      <table>\r\n        <colgroup><col style=\"width:9%\"><col style=\"width:14%\"><col style=\"width:12%\"><col style=\"width:12%\"><col style=\"width:12%\"><col style=\"width:11%\"><col style=\"width:15%\"><col style=\"width:15%\"></colgroup>\r\n        <thead>\r\n          <tr>\r\n            <th>股数档位</th>\r\n            <th>所需资金(正股)</th>\r\n            <th>理论获配</th>\r\n            <th>实际获配</th>\r\n            <th>预期盈利</th>\r\n            <th>安全垫</th>\r\n            <th>星级评级</th>\r\n            <th>该档评级</th>\r\n          </tr>\r\n        </thead>\r\n        <tbody id=\"tierBody\" class=\"num-tabular\"><tr><td colspan=\"8\" style=\"padding:24px;color:#9ca3af;text-align:center;\">正在计算档位数据，请稍候…</td></tr></tbody>\r\n      </table>\r\n    </div>\r\n    <div class=\"hint\" style=\"margin-top:12px;\">\r\n      说明：深市配债按张计算，理论获配金额<b>向下取整百元</b>，舍去不足100元的零碎面值（不四舍五入、不进位）。\r\n      持仓体量越小，碎面损耗越高、实际安全垫越低。上表「实际获配」已套用该铁规。\r\n    </div>\r\n  </div>\r\n\r\n  <div class=\"card\">\r\n    <div class=\"section-h\">三、风险评级结论</div>\r\n    <div class=\"verdict\">\r\n      <div><span class=\"big-stars\" id=\"headlineStars\">—</span><span class=\"label\" id=\"headlineLabel\">—</span></div>\r\n      <div class=\"line\">基准安全垫（满配理论）：<b id=\"headlineCushion\">—</b> ｜ 评级阈值：≥9%★★★★★ ｜ 7–9%★★★★ ｜ 4–7%★★★ ｜ 2–4%★★ ｜ &lt;2%★</div>\r\n      <div class=\"line\">注：基准安全垫按「忽略碎面损耗」测算，代表大资金满配下的理想安全垫；小仓位实际安全垫见上表各档，会低于基准值。</div>\r\n    </div>\r\n  </div>\r\n\r\n  <div class=\"card notes\">\r\n    <div class=\"section-h\">四、注释说明</div>\r\n\r\n    <h4>核心策略模型</h4>\r\n    <ul>\r\n      <li>登记日潜伏买入正股 → 收盘确权获取转债配售权 → 缴款日清仓正股 → 持有转债上市套利。</li>\r\n    </ul>\r\n\r\n    <h4>标准交易执行策略</h4>\r\n    <ul>\r\n      <li><b>低风险潜伏打法（首选推荐）</b>：登记日前 3–5 天分批建底仓，不一次性满仓；股价上涨则减仓兑现浮盈、保留核心底仓锁定配债权、被动增厚安全垫；股价下跌则分批加仓摊薄成本、主动增厚安全垫；股权登记日收盘锁定最终持仓确保确权；配债缴款日开盘无条件清仓全部正股，仅保留转债等待上市套利。</li>\r\n      <li><b>短线尾盘突击打法（高风险）</b>：登记日尾盘 14:40–14:55 集中建仓，最小化资金占用时间；优势是资金闲置成本极低，劣势是无择时、摊成本空间，尾盘抢筹易抬高成本、压缩安全垫。</li>\r\n    </ul>\r\n\r\n    <h4>核心风控铁律（永久通用）</h4>\r\n    <ul>\r\n      <li>所有盈利、安全垫测算基于「自定义转债上市价格」，行情走弱/走强需手动调整参数重新演算风险。</li>\r\n      <li>深市零碎配债面值全部舍去，持仓体量越小，配售资金损耗越高。</li>\r\n      <li>抢权套利最大风险：缴款日套利资金集体兑现砸盘，单日踩踏下跌击穿安全垫。</li>\r\n      <li>配债为股东权利，确权后需<b>手动缴款</b>，未缴款自动放弃配售额度。</li>\r\n      <li>本策略为纯短线套利，正股不做中长期持有，杜绝趋势博弈。</li>\r\n    </ul>\r\n\r\n    <h4>五星风险评级体系（永久复用）</h4>\r\n    <ul>\r\n      <li>★★★★★ 极致优质：安全垫 ≥9%，小盘转债、潜伏窗口期充足、容错极高。</li>\r\n      <li>★★★★ 优质稳健：安全垫 7%–9%，性价比优异，适合主力重仓参与。</li>\r\n      <li>★★★ 中性博弈：安全垫 4%–7%，容错一般，仅适合小仓位试错。</li>\r\n      <li>★★ 风险偏弱：安全垫 2%–4%，回撤风险高，不建议常规参与。</li>\r\n      <li>★ 极致垃圾：安全垫 &lt;2%，极易总账亏损，直接放弃标的。</li>\r\n    </ul>\r\n\r\n    <h4>可流通规模倒推逻辑（永久复用 · 禁止瞎估）</h4>\r\n    <ul>\r\n      <li>规则依据：2023 年《证券发行与承销管理办法》修订后，原股东优先配售的可转债中，<b>持股 ≥5% 的股东、实际控制人及其一致行动人、董监高</b>参与配售的部分，自发行结束之日起 <b>6 个月内不得转让（锁定）</b>；其余持股 &lt;5% 且非一致行动人的原股东配售部分，以及网上/网下中签部分，上市首日即可全流通。</li>\r\n      <li>倒推公式：<b>锁定部分（亿元）= 锁定股东合计持股数 × 每股配售金额 × 大股东配售参与比例 ÷ 1 亿</b>；<b>可流通规模 = 发行总规模 − 锁定部分</b>。</li>\r\n      <li>锁定股东范围：控股股东 + 实际控制人 + 其一致行动人（即使单个持股 &lt;5%，只要属一致行动人也计入）。大股东若<b>放弃配售</b>，相应份额转网上发行、变为全流通，流通规模会显著变大——因此「大股东配不配债」是流通盘的核心变量。</li>\r\n      <li>本页「转债可流通规模」由上述公式<b>自动倒推、不接受手填</b>，确保每页数字都可回溯到公告披露的大股东持股与配售参与比例，杜绝主观乱估。</li>\r\n    </ul>\r\n\r\n    <h4>经典标的对标案例（固化参考 · 默认上市价 157.3）</h4>\r\n    <table class=\"bench\">\r\n      <thead><tr><th>标的</th><th>基准安全垫（默认157.3）</th><th>风险评级</th><th>核心优劣总结</th></tr></thead>\r\n      <tbody>\r\n        <tr><td>玉禾田（玉禾转债）</td><td>10%+</td><td>★★★★★</td><td>厚安全垫（10%+）、容错极高；但流通盘约 9.7 亿非迷你债，炒作弹性有限</td></tr>\r\n        <tr><td>丰茂股份（丰茂转债）</td><td>9%+</td><td>★★★★★</td><td>迷你债（流通约 1.5 亿）易爆炒、安全垫充足，当期最优套利标的</td></tr>\r\n        <tr><td>震裕科技（震裕转02）</td><td>4.2%左右</td><td>★★★</td><td>安全垫极薄、无潜伏窗口期、波动大，仅适合博弈型小仓位</td></tr>\r\n      </tbody>\r\n    </table>\r\n  </div>\r\n\r\n</div>\r\n\r\n<script>\r\n  // —— 固定测算仓位档位（统一标准，无需自定义）——\r\n  const TIERS = [100,200,300,400,500,600,700,800,900,1000,2000,3000,4000];\r\n  const DEFAULT_LISTING = 157.3;\r\n\r\n  function ratingFor(c){\r\n    if (c >= 9) return { stars:'★★★★★', label:'极致优质', cls:'r5' };\r\n    if (c >= 7) return { stars:'★★★★',   label:'优质稳健', cls:'r4' };\r\n    if (c >= 4) return { stars:'★★★',    label:'中性博弈', cls:'r3' };\r\n    if (c >= 2) return { stars:'★★',     label:'风险偏弱', cls:'r2' };\r\n    return        { stars:'★',       label:'极致垃圾', cls:'r1' };\r\n  }\r\n  function fmt(n, d){\r\n    if (!isFinite(n)) return '—';\r\n    return Number(n).toLocaleString('zh-CN', { minimumFractionDigits:d, maximumFractionDigits:d });\r\n  }\r\n\r\n  function showError(msg){\r\n    const err = document.getElementById('calcError');\r\n    if (err) { err.textContent = '计算异常：' + msg; err.style.display = 'block'; }\r\n  }\r\n\r\n  // 核心公式（参数联动）\r\n  // 所需资金 = 持股数量 × 收盘价\r\n  // 理论获配 = 持股数量 × 每股配售金额\r\n  // 实际获配 = 沪市(60/688) FLOOR(理论获配 ÷ 1000) × 1000；深市(00/30) FLOOR(理论获配 ÷ 100) × 100\r\n  // 预期盈利 = (实际获配 ÷ 100) × (上市价 − 100)\r\n  // 安全垫   = 预期盈利 ÷ 所需资金 × 100%   （保留2位小数）\r\n  // 需要金额 = 正股所需资金 + 实际获配转债面值\r\n  function recompute(manual){\r\n    try {\r\n    const P  = parseFloat(document.getElementById('price').value) || 0;\r\n    const A  = parseFloat(document.getElementById('perShare').value) || 0;\r\n    const noScheme = !(A > 0);   // 方案未定（无每股配售）→ 获配/安全垫用横杠，不误导\r\n    const L  = parseFloat(document.getElementById('listingPrice').value) || DEFAULT_LISTING;\r\n    const profitPerBond = L - 100;\r\n\r\n    document.getElementById('profitPerBond').textContent = noScheme ? '—' : (fmt(profitPerBond, 1) + ' 元');\r\n\r\n    const tbody = document.getElementById('tierBody');\r\n    tbody.innerHTML = '';\r\n    TIERS.forEach(function(N){\r\n      const cost   = N * P;                       // 所需资金(正股)\r\n      const theo   = noScheme ? null : N * A;       // 理论获配\r\n      const codeEl = document.getElementById('code');\r\n      const isSH   = codeEl && String(codeEl.value)[0] === '6'; // 沪市(60/688)按手(1000)取整\r\n      const actual = noScheme ? null : (isSH ? Math.floor(theo / 1000) * 1000 : Math.floor(theo / 100) * 100); // 实际获配：沪市floor1000 / 深市floor100\r\n      const profit = noScheme ? null : (actual / 100) * profitPerBond; // 预期盈利\r\n      const cushion = (noScheme || cost <= 0) ? null : profit / cost * 100; // 安全垫%\r\n      const r = cushion == null ? null : ratingFor(cushion);\r\n      const tr = document.createElement('tr');\r\n      tr.innerHTML =\r\n        '<td class=\"tier\">' + N + '</td>' +\r\n        '<td class=\"num\">' + fmt(cost, 0) + '</td>' +\r\n        '<td class=\"num\">' + (noScheme ? '—' : fmt(theo, 2)) + '</td>' +\r\n        '<td class=\"num\">' + (noScheme ? '—' : fmt(actual, 0)) + '</td>' +\r\n        '<td class=\"num\">' + (noScheme ? '—' : fmt(profit, 2)) + '</td>' +\r\n        '<td class=\"cushion\">' + (noScheme ? '—' : fmt(cushion, 2) + '%') + '</td>' +\r\n        '<td class=\"stars ' + (r ? r.cls : '') + '\">' + (noScheme ? '—' : r.stars) + '</td>' +\r\n        '<td class=\"' + (r ? r.cls : '') + '\">' + (noScheme ? '—' : r.label) + '</td>';\r\n      tbody.appendChild(tr);\r\n    });\r\n\r\n    // 理论安全垫（满配·忽略碎面损耗）= 每股配售盈利 ÷ 每股股价，已是百分比\r\n    // 每股配售盈利 = (A/100) × 上市盈利；÷ 股价 P；×100%  ⇒  A × 上市盈利 ÷ P\r\n    const theoCushion = (P > 0 && A > 0) ? (A * profitPerBond) / P : null;\r\n    const head = noScheme ? null : ratingFor(theoCushion);\r\n    document.getElementById('theoCushion').textContent = noScheme ? '—' : fmt(theoCushion, 2) + '%';\r\n    document.getElementById('headlineStars').textContent = noScheme ? '—' : head.stars;\r\n    document.getElementById('headlineLabel').textContent = noScheme ? '方案未定' : head.label;\r\n    document.getElementById('headlineCushion').textContent = noScheme ? '—' : fmt(theoCushion, 2) + '%';\r\n\r\n    // 可流通规模倒推（底层逻辑：总规模 − 锁定股东优先配售锁定部分）\r\n    // 规则：2023《证券发行与承销管理办法》修订后，持股≥5%股东、实控人及其一致行动人、董监高\r\n    //       通过优先配售取得的可转债，发行结束日起 6 个月内不得转让（锁定）；其余原股东及网申中签上市首日全流通。\r\n    // 倒推公式：锁定部分(亿元) = 锁定股东合计持股数(股) × 每股配售(元/股) × 参与比例 ÷ 1e8\r\n    //           可流通规模      = 发行总规模 − 锁定部分\r\n    const issue      = parseFloat(document.getElementById('issueSize').value) || 0;\r\n    const lockShares = parseFloat(document.getElementById('lockShares').value) || 0;\r\n    const lockRatio  = parseFloat(document.getElementById('lockRatio').value) || 0;\r\n    const floatEl    = document.getElementById('floatScale');\r\n    if (lockShares > 0) {\r\n      const locked     = lockShares * A * (lockRatio / 100) / 1e8;   // 亿元\r\n      const floatScale = issue - locked;                            // 亿元（自动倒推，只读）\r\n      floatEl.value = fmt(floatScale, 2);\r\n    } else {\r\n      // 无锁定股东数据时保留生成器注入值，不瞎算\r\n      const current = parseFloat(floatEl.value) || 0;\r\n      if (!current) floatEl.value = '';\r\n    }\r\n    const err = document.getElementById('calcError');\r\n    if (err) err.style.display = 'none';\r\n\r\n    // —— 视觉反馈：被改动的 cell 短暂高亮，让用户确信「确实重算过了」——\r\n    flashCells();\r\n    if (manual) console.log('[潜伏配债] 手动重算完成 P=' + P + ' A=' + A);\r\n  } catch (e) {\r\n    showError(e.message);\r\n  }\r\n  }\r\n\r\n  // 单元 cell 短暂高亮（手动/轮询/编辑 三种触发都能看到反馈）\r\n  function flashCells(){\r\n    const cells = document.querySelectorAll('tbody#tierBody td.num, tbody#tierBody td.cushion');\r\n    cells.forEach(function(c){\r\n      c.classList.remove('flash');\r\n      // 强制 reflow 重启动画\r\n      void c.offsetWidth;\r\n      c.classList.add('flash');\r\n    });\r\n  }\r\n\r\n  // —— 多重事件监听（兜底覆盖所有输入路径，永远不出错）——\r\n  // 覆盖：input(键入/paste/spinner) / change(失焦/spinner确定) / keyup(方向键/spinner) / blur(失焦)\r\n  // 同时给关键字段（price/perShare/listingPrice/lockShares/lockRatio/issueSize）装 setter 代理：\r\n  //   任何方式改值（含 JS 赋值 / 实时行情轮询写回 / spinner / paste / IME）都触发 recompute\r\n  //   不依赖任何事件，永不出错\r\n  function attachListeners(){\r\n    var inputs = document.querySelectorAll('.form-grid input');\r\n    for (var i = 0; i < inputs.length; i++){\r\n      (function(el){\r\n        el.addEventListener('input',  function(){ recompute(); });\r\n        el.addEventListener('change', function(){ recompute(); });\r\n        el.addEventListener('keyup',  function(){ recompute(); });\r\n        el.addEventListener('blur',   function(){ recompute(); });\r\n      })(inputs[i]);\r\n    }\r\n    // 表单级事件委托：万一某天动态添加了 input 没绑到，也不漏\r\n    var form = document.querySelector('.form-grid');\r\n    if (form){\r\n      form.addEventListener('input', function(){ recompute(); });\r\n    }\r\n    // —— 价格自动 / 手动 模式开关 ——\r\n  window._priceAutoMode = true;  // 默认自动：实时价每 8s 覆盖 input.value\r\n  function setModeUI(){\r\n    var badge = document.getElementById('priceModeBadge');\r\n    if (!badge) return;\r\n    var auto = (window._priceAutoMode !== false);\r\n    badge.classList.toggle('auto', auto);\r\n    badge.classList.toggle('manual', !auto);\r\n    badge.innerHTML = auto ? '自动' : '手动';\r\n  }\r\n  (function initPriceMode(){\r\n    var badge = document.getElementById('priceModeBadge');\r\n    var input = document.getElementById('price');\r\n    if (!badge || !input) return;\r\n    // 用户一旦手动改价 → 自动切到手动模式，避免被实时轮询覆盖（测算才稳）\r\n    input.addEventListener('input', function(){\r\n      if (window._priceAutoMode !== false){\r\n        window._priceAutoMode = false;\r\n        setModeUI();\r\n      }\r\n    });\r\n    // 增强 UX：用户点击收盘价/上市价输入框 → 立即进入手动模式（不必非要改数字）\r\n    // 让\"手动模拟\"门槛更低：一点就锁住，避免实时价悄悄覆盖用户准备测算的数字\r\n    function enterManualFromClick(){\r\n      if (window._priceAutoMode !== false){\r\n        window._priceAutoMode = false;\r\n        setModeUI();\r\n      }\r\n    }\r\n    input.addEventListener('click', enterManualFromClick);\r\n    var lpInput = document.getElementById('listingPrice');\r\n    if (lpInput){ lpInput.addEventListener('click', enterManualFromClick); }\r\n    badge.addEventListener('click', function(){\r\n      window._priceAutoMode = !window._priceAutoMode;\r\n      setModeUI();\r\n      // 切回自动 → 立即拉一次实时价并应用；切到手动 → 立即重算一次\r\n      if (typeof refreshLivePrice === 'function') refreshLivePrice();\r\n      else recompute();\r\n    });\r\n    setModeUI();\r\n  })();\r\n\r\n  // —— setter 代理：关键字段任何「.value = X」赋值都触发 recompute ——\r\n    var proxyIds = ['price', 'perShare', 'listingPrice', 'lockShares', 'lockRatio', 'issueSize'];\r\n    proxyIds.forEach(function(id){\r\n      var el = document.getElementById(id);\r\n      if (!el || el.__proxyWired) return;\r\n      el.__proxyWired = true;\r\n      var desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');\r\n      Object.defineProperty(el, 'value', {\r\n        get: function(){ return desc.get.call(this); },\r\n        set: function(v){\r\n          desc.set.call(this, v);\r\n          // 异步触发重算，避免 setter 同步链路里直接改 tbody 引发重排异常\r\n          if (typeof recompute === 'function') recompute();\r\n        }\r\n      });\r\n    });\r\n  }\r\n\r\n  // —— 终极兜底：500ms 心跳对比快照，任何字段变了就强制 recompute ——\r\n  // 不依赖 input/change/keyup/blur 任何事件；浏览器扩展拦截、IME、缓存旧 JS、prototype setter 走私有通道等都覆盖。\r\n  // 输入框数量极少（<15），读取极轻，500ms 不可感知。\r\n  (function startHeartbeat(){\r\n    var ids = ['price', 'perShare', 'listingPrice', 'lockShares', 'lockRatio', 'issueSize', 'addDate', 'convPrice'];\r\n    function snapshot(){\r\n      var snap = {};\r\n      ids.forEach(function(id){\r\n        var el = document.getElementById(id);\r\n        if (el) snap[id] = el.value;\r\n      });\r\n      return snap;\r\n    }\r\n    var prev = snapshot();\r\n    setInterval(function(){\r\n      var cur = snapshot();\r\n      var changed = false;\r\n      for (var k in cur){\r\n        if (cur[k] !== prev[k]) { changed = true; break; }\r\n      }\r\n      if (changed && typeof recompute === 'function'){\r\n        prev = cur;\r\n        recompute();\r\n        // 心跳触发不显示 flash（避免和用户主动改价视觉混淆）\r\n      }\r\n    }, 500);\r\n  })();\r\n\r\n  // 制表日期：生成时已写入则保留；打开时仍为占位符则补为当天，便于回溯\r\n  (function initDate(){\r\n    const d = document.getElementById('tableDateValue');\r\n    if (!d || d.textContent === '—' || !d.textContent.trim()) {\r\n      const t = new Date();\r\n      const p = function(n){ return String(n).padStart(2,'0'); };\r\n      d.textContent = t.getFullYear() + '-' + p(t.getMonth()+1) + '-' + p(t.getDate());\r\n    }\r\n  })();\r\n\r\n  // 已关注 N 天 · 右上角小角标（选项 B）：从「加表日期」算到今天，每天自然 +1\r\n  function watchDays(addDate){\r\n    if (!addDate) return null;\r\n    const m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(String(addDate).trim());\r\n    if (!m) return null;\r\n    const d = new Date(+m[1], +m[2]-1, +m[3]);\r\n    const t = new Date();\r\n    const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());\r\n    const diff = Math.floor((today - d) / 86400000);\r\n    return isNaN(diff) || diff < 0 ? null : diff;\r\n  }\r\n  function updateWatchBadge(){\r\n    const el = document.getElementById('watchBadge');\r\n    if (!el) return;\r\n    const addDate = (document.getElementById('addDate') || {}).value;\r\n    const n = watchDays(addDate);\r\n    if (n == null){ el.classList.add('empty'); }\r\n    else {\r\n      el.classList.remove('empty');\r\n      document.getElementById('watchBadgeText').textContent = '已关注 ' + n + ' 天';\r\n    }\r\n  }\r\n  updateWatchBadge();\r\n  const _addDateInput = document.getElementById('addDate');\r\n  if (_addDateInput) _addDateInput.addEventListener('input', updateWatchBadge);\r\n\r\n  // ===========================================================\r\n  // 实时行情模块（继承汇总看板：腾讯 qt.gtimg 主源 + 东财 push2 兜底）\r\n  // 交易时段 09:15–11:30 / 13:00–15:00 每 8 秒刷新；用户正在编辑时不覆盖\r\n  // ===========================================================\r\n  function pad(n){ return String(n).padStart(2,'0'); }\r\n  function isTradingNow(){\r\n    var now = new Date();\r\n    // 用北京时间判定\r\n    var utc = now.getTime() + now.getTimezoneOffset() * 60000;\r\n    var bj = new Date(utc + 8 * 3600000);\r\n    var day = bj.getDay();\r\n    if (day === 0 || day === 6) return false;\r\n    var t = bj.getHours() * 60 + bj.getMinutes();\r\n    return (t >= 9 * 60 + 15 && t <= 11 * 60 + 30) || (t >= 13 * 60 && t <= 15 * 60);\r\n  }\r\n  function jsonp(url, cbName, timeout){\r\n    return new Promise(function(resolve, reject){\r\n      var s = document.createElement('script');\r\n      var cb = cbName + '_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);\r\n      var timer = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, timeout || 6000);\r\n      function cleanup(){ clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }\r\n      window[cb] = function(data){ cleanup(); resolve(data); };\r\n      s.onerror = function(){ cleanup(); reject(new Error('script error')); };\r\n      s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + cb;\r\n      document.head.appendChild(s);\r\n    });\r\n  }\r\n\r\n  // —— 行情取价（腾讯 qt.gtimg 主源 + 东财 push2 兜底），支持批量 codes ——\r\n  // codes 形如 ['sh603339','sz300727']；返回 { '603339': {price, gainPct}, ... }\r\n  function marketPrefix(code){ return String(code)[0] === '6' ? 'sh' : 'sz'; }\r\n\r\n  // 腾讯 qt.gtimg：轮询探测式。\r\n  // 关键改进：不再依赖 s.onload 单点回调（偶发 onload 不触发就会永久卡在\"正在连接\"），\r\n  // 改为注入 script 后每 120ms 探一次 window['v_xxx']，命中即 resolve；硬超时兜底。\r\n  function fetchTXPrices(codes){\r\n    return new Promise(function(resolve, reject){\r\n      if (!codes || !codes.length) return reject(new Error('no codes'));\r\n      var s = document.createElement('script');\r\n      var TIMEOUT = 4500;\r\n      var start = Date.now();\r\n      var settled = false;\r\n      function finish(ok, reason){\r\n        if (settled) return; settled = true;\r\n        clearInterval(poll); clearTimeout(fail);\r\n        if (s.parentNode) s.parentNode.removeChild(s);\r\n        if (ok) resolve(ok); else reject(new Error(reason));\r\n      }\r\n      var poll = setInterval(function(){\r\n        var out = {};\r\n        for (var i = 0; i < codes.length; i++){\r\n          var raw = window['v_' + codes[i]];\r\n          if (!raw) continue;\r\n          var p = raw.split('~');\r\n          var price = parseFloat(p[3]);\r\n          if (!isFinite(price) || price <= 0) continue;\r\n          var prev = parseFloat(p[4]) || price;\r\n          out[codes[i].slice(2)] = { price: price, gainPct: prev > 0 ? (price - prev) / prev * 100 : 0 };\r\n        }\r\n        if (Object.keys(out).length) return finish(out);\r\n        if (Date.now() - start > TIMEOUT) return finish(null, 'tx timeout');\r\n      }, 120);\r\n      var fail = setTimeout(function(){ finish(null, 'tx timeout'); }, TIMEOUT + 600);\r\n      s.onerror = function(){ finish(null, 'tx error'); };\r\n      s.src = 'https://qt.gtimg.cn/q=' + codes.join(',');\r\n      document.head.appendChild(s);\r\n    });\r\n  }\r\n\r\n  // 东财 push2 兜底（JSONP，主源失败时）\r\n  function fetchEMPrices(codes){\r\n    var secids = codes.map(function(c){\r\n      var num = c.slice(2);\r\n      return (num[0] === '6' ? '1.' : '0.') + num;\r\n    }).join(',');\r\n    var url = 'https://push2.eastmoney.com/api/qt/ulist.np/get?ut=fa5fd1943c7b386f172d6893dbfba10b&invt=2&fltt=2&secids=' + encodeURIComponent(secids) + '&fields=f2,f3,f4';\r\n    return jsonp(url, 'emcb').then(function(data){\r\n      if (!data || data.rc !== 0 || !data.data || !data.data.diff) throw new Error('em empty');\r\n      var out = {};\r\n      for (var k in data.data.diff){\r\n        var it = data.data.diff[k];\r\n        var price = parseFloat(it.f2);\r\n        if (!isFinite(price) || price <= 0) continue;\r\n        var code = k.indexOf('.') >= 0 ? k.split('.')[1] : k;\r\n        out[code] = { price: price, gainPct: parseFloat(it.f3) };\r\n      }\r\n      if (!Object.keys(out).length) throw new Error('em no price');\r\n      return out;\r\n    });\r\n  }\r\n\r\n  function setLiveStatus(text, kind){\r\n    var el = document.getElementById('liveStatus');\r\n    if (!el) return;\r\n    el.classList.remove('idle', 'err');\r\n    if (kind === 'err') el.classList.add('err');\r\n    else if (kind === 'idle') el.classList.add('idle');\r\n    document.getElementById('liveStatusText').textContent = text;\r\n  }\r\n\r\n  // 价格变动闪烁（涨红跌绿，A股习惯）；交易时段才闪，收盘锁定不闪\r\n  function flashPrice(dir){\r\n    if (!dir || !isTradingNow()) return;\r\n    var row = document.querySelector('.price-row');\r\n    if (!row) return;\r\n    var cls = dir === 'up' ? 'flash-up' : 'flash-down';\r\n    row.classList.remove('flash-up', 'flash-down');\r\n    void row.offsetWidth; // 强制 reflow，重启动画\r\n    row.classList.add(cls);\r\n  }\r\n\r\n  // 拉最新价：腾讯主源 → 东财兜底；交易时段=实时tick，非交易时段=今收（API 直接返回最新价）\r\n  // 无论交易与否，页面加载即拉一次 —— 收盘后也显示今收价，而非生成时的旧值\r\n  function refreshLivePrice(){\r\n    var codeEl = document.getElementById('code');\r\n    if (!codeEl || !codeEl.value) return;\r\n    var code = String(codeEl.value);\r\n    var codes = [ marketPrefix(code) + code ];\r\n    var priceInput = document.getElementById('price');\r\n    var tickEl = document.getElementById('priceLiveTick');\r\n\r\n    // 立即给反馈：进入\"正在连接\"状态，避免长时间显示\"等待刷新\"\r\n    setLiveStatus('实时价 · 正在连接行情源（' + code + '）…', 'idle');\r\n    if (tickEl) tickEl.textContent = '正在拉取…';\r\n\r\n    fetchTXPrices(codes).catch(function(){ return fetchEMPrices(codes); }).then(function(map){\r\n      var lv = map[code];\r\n      if (!lv) return;\r\n      var price = lv.price;\r\n      var prevVal = parseFloat(priceInput.value);\r\n      var dir = (isFinite(prevVal) && price > prevVal + 1e-6) ? 'up' : (isFinite(prevVal) && price < prevVal - 1e-6) ? 'down' : '';\r\n      // fetch 是异步的，期间用户可能已手动改价并切到 manual 模式，必须重读全局状态\r\n      var autoNow = (window._priceAutoMode !== false);\r\n      var gainTxt = (lv.gainPct != null && isFinite(lv.gainPct)) ? ('（' + (lv.gainPct >= 0 ? '+' : '') + lv.gainPct.toFixed(2) + '%）') : '';\r\n      if (tickEl) tickEl.textContent = '实时参考 ' + price.toFixed(2) + gainTxt;\r\n      // 自动模式 → 把最新价写回输入框并立刻重算（股价一变，安全垫就变）\r\n      if (autoNow && priceInput && document.activeElement !== priceInput){\r\n        var cur = parseFloat(priceInput.value);\r\n        if (!isFinite(cur) || Math.abs(cur - price) >= 0.005){\r\n          priceInput.value = price.toFixed(2);\r\n          recompute();\r\n        }\r\n      }\r\n      flashPrice(dir);\r\n      var t = new Date();\r\n      var clock = pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds());\r\n      var suffix = isTradingNow() ? '（实时 · 3s 刷新）' : '（今收已锁定）';\r\n      setLiveStatus('实时价 ' + price.toFixed(2) + ' · ' + clock + (autoNow ? suffix : '（手动模式）'), null);\r\n    }).catch(function(){\r\n      setLiveStatus('实时价 · 获取失败，沿用当前输入（将自动重试）', 'err');\r\n      if (tickEl) tickEl.textContent = '获取失败 · 重试';\r\n    });\r\n  }\r\n\r\n  // 页面加载：无论交易与否，先拉一次最新价（收盘后=今收，盘中=实时tick）\r\n  refreshLivePrice();\r\n  // 仅交易时段轮询（收盘后价格已锁定，无需反复拉）；手动模式不轮询覆盖\r\n  setInterval(function(){\r\n    if (isTradingNow() && window._priceAutoMode !== false) refreshLivePrice();\r\n  }, 3000);\r\n\r\n  // 计算入口：立即执行 + DOMReady + Load 三重保险，确保在各种预览环境都能渲染\r\n  function runCompute(){\r\n    try {\r\n      recompute();\r\n      console.log('[潜伏配债] 档位计算完成');\r\n    } catch(e) {\r\n      console.error('[潜伏配债] 计算异常:', e);\r\n      showError(e.message + '（请按 F12 查看控制台详情）');\r\n    }\r\n  }\r\n  runCompute();\r\n  if (document.readyState === 'loading') {\r\n    document.addEventListener('DOMContentLoaded', runCompute);\r\n    window.addEventListener('load', runCompute);\r\n  } else {\r\n    // DOM 已就绪，但仍可能在 load 后某些资源加载导致重排，再补一次\r\n    runCompute();\r\n    if (document.readyState !== 'complete') {\r\n      window.addEventListener('load', runCompute);\r\n    }\r\n  }\r\n  // 多重事件监听 - 最后挂上\r\n  attachListeners();\r\n<\\/script>\r\n</body>\r\n</html>\r\n";

function compute(d){
  const contain = d.perShare / d.price * 100;         // 含权量(百元)
  const minShares = d.minShares || Math.ceil(100 / d.perShare / 100) * 100;
  const rtPrice = d.rtPrice != null ? d.rtPrice : d.price;
  const tableGain = (rtPrice - d.price) / d.price;
  const cushConsNum = d.optimalCushionCons || 0;
  const cushAggrNum = d.optimalCushionAggr || 0;
  const starsCons = cushConsNum>=0.09?5:cushConsNum>=0.07?4:cushConsNum>=0.04?3:cushConsNum>=0.02?2:1;
  const starsAggr = cushAggrNum>=0.09?5:cushAggrNum>=0.07?4:cushAggrNum>=0.04?3:cushAggrNum>=0.02?2:1;
  return {contain, minShares, rtPrice, tableGain, cushConsNum, cushAggrNum, starsCons, starsAggr,
          optimalShares:d.optimalShares||minShares, optimalCost:d.optimalCost||0,
          optimalTheo:d.optimalTheo||0, optimalActual:d.optimalActual||0};
}

  function watchDays(addDate){
    if (!addDate) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(addDate).trim());
    if (!m) return null;
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    const t = new Date();
    const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const diff = Math.floor((today - d) / 86400000);
    return isNaN(diff) || diff < 0 ? null : diff;
  }

    ...(function(){

      const part = isFinite(lockPart) ? lockPart.toFixed(2) : '—';
      const txt = '锁定(' + (r.lockDate||'—') + ')：' + lockNames

        + ' ÷1e8 = 锁定 ' + part + ' 亿 ｜ 可流通 = 发行 ' + fmt(r.issue,2) + ' − 锁定 ' + part + ' = ' + fmt(r.fs,2) + ' 亿';

    })(),
    ['转股价', fmt(r.conv,2)],

  ];
  let h = '<div class="detail-wrap"><div class="detail-grid">';

}
function toggleExpand(tr, r){
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains('detail-row')){
    nx.remove(); tr.classList.remove('row-expanded'); return;
  }
  const dr = document.createElement('tr');
  dr.className = 'detail-row';
  dr.innerHTML = '<td colspan="24">' + detailHtml(r) + '</td>';
  tr.classList.add('row-expanded');
  tr.parentNode.insertBefore(dr, tr.nextSibling);
}

function doSearch(){
  const raw = document.getElementById('searchInput').value.trim();
  if (!raw) return;
  // 先重置进度筛选，确保目标在全部标的中可见
  document.getElementById('filterStage').value = '';
  render();
  const tbody = document.getElementById('tbody');
  const q = raw.replace(/\s/g, '').toLowerCase();
  let found = null;
  // 优先精确匹配代码或名称
  // 注意：name-cell 与 code 列都带 class="click" data-code，code 列需排除 name-cell
  for (const tr of tbody.querySelectorAll('tr')){
    const codeTd = tr.querySelector('td.click[data-code]:not(.name-cell)');
    const nameTd = tr.querySelector('td.name-cell');
    if (!codeTd || !nameTd) continue;
    const code = codeTd.textContent.trim();
    const name = nameTd.textContent.trim();
    if (code === raw || name === raw) { found = tr; break; }
  }
  // 次优模糊匹配
  if (!found){
    for (const tr of tbody.querySelectorAll('tr')){
      const codeTd = tr.querySelector('td.click[data-code]:not(.name-cell)');
      const nameTd = tr.querySelector('td.name-cell');
      if (!codeTd || !nameTd) continue;
      const code = codeTd.textContent.trim();
      const name = nameTd.textContent.trim().toLowerCase();
      if (code.includes(raw) || name.includes(q)) { found = tr; break; }
    }
  }
  if (found){
    tbody.querySelectorAll('tr').forEach(tr => tr.classList.remove('search-found'));
    found.classList.add('search-found');
    found.scrollIntoView({behavior: 'smooth', block: 'center'});
    setTimeout(() => found.classList.remove('search-found'), 8000);
  }
}

// 待发 / 历史切换：已上市且满 7 个交易日 → 历史
let viewMode = 'pending';
function parseLocalDate(s){ return new Date(s + 'T00:00:00+08:00'); }
function tradingDaysAfter(startStr){
  const start = parseLocalDate(startStr);
  const now = new Date();
  let count = 0;
  const d = new Date(start);
  d.setDate(d.getDate() + 1);
  while (d <= now){
    const day = d.getDay();
    if (day !== 0 && day !== 6) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}
function isHistoryRow(r){ return r.listDate && tradingDaysAfter(r.listDate) >= 7; }

function render(){
  const fs = document.getElementById('filterStage').value;
  const sort = document.getElementById('sortBy').value;
  let rows = DATA.map(d=>({...d, ...compute(d)}));
  if(viewMode === 'pending'){
    rows = rows.filter(r => !isHistoryRow(r));
  } else if(viewMode === 'history'){
    rows = rows.filter(r => isHistoryRow(r));
  }
  if(fs){
    const n = parseInt(fs,10);
    rows = rows.filter(r => stageNum(r.stage) === n);
  }
  rows.sort((a,b)=>{
    if(sort==='cush') return b.cushConsNum-a.cushConsNum;
    if(sort==='cushAggr') return b.cushAggrNum-a.cushAggrNum;
    if(sort==='contain') return b.contain-a.contain;
    if(sort==='float'){ const av=a.fs==null?1e9:a.fs, bv=b.fs==null?1e9:b.fs; return av-bv; }
    if(sort==='gain') return b.tableGain-a.tableGain;
    if(sort==='reg') return a.reg<b.reg?-1:1;
    return 0;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML='';
  let order=0;

        ? '暂无历史转债 — 已上市且满 7 个交易日的标的会自动归到此处'

    const noScheme = !(r.perShare > 0);   // 方案未定（无每股配售）→ 派生列用横杠，不误导
        tr.innerHTML =
      '<td class="ind-col">'+r.ind.replace(/\//g, '/<wbr>')+'</td>'+
      '<td class="name-cell click" data-code="'+r.code+'">'+r.name+'</td>'+
      '<td class="click" data-code="'+r.code+'">'+r.code+'</td>'+
      '<td>'+r.board+'</td>'+
      '<td class="stage" title="'+r.stage+'">'+stageNum(r.stage)+'</td>'+
      '<td class="num">'+fmt(r.issue,2)+'</td>'+
      '<td class="num">'+(r.fs==null?'—':fmt(r.fs,2))+'</td>'+
      '<td class="num">'+fmt(r.conv,2)+'</td>'+
      '<td class="num">'+fmt(r.price,2)+'</td>'+
      '<td class="num">'+fmt(r.rtPrice,2)+'</td>'+
      '<td class="num '+(r.tableGain>=0?'rate4':'rate1')+'">'+fmt(r.tableGain*100,2)+'%</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.perShare,1))+'</td>'+
      '<td class="num" style="background:var(--amber-tint);font-weight:800;">'+(noScheme?'—':r.optimalShares)+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.optimalTheo,0))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.optimalActual,0))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.consPrice,1))+'</td>'+
      '<td class="cush">'+(noScheme?'—':(fmt(r.cushConsNum*100,2)+'%<br><span class="star-mark">'+'★'.repeat(r.starsCons)+'</span>'))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.aggrPrice,1))+'</td>'+
      '<td class="cush">'+(noScheme?'—':(fmt(r.cushAggrNum*100,2)+'%<br><span class="star-mark">'+'★'.repeat(r.starsAggr)+'</span>'))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.optimalCost,0))+'</td>'+
      '<td class="num">'+(noScheme?'—':fmt(r.contain,2))+'</td>'+
      '<td>'+r.reg+'</td>'+
      '<td>'+(r.progressDate||'—')+'</td>'+
      '<td>'+(++order)+'</td>';
    tbody.appendChild(tr);
    tr.addEventListener('click', function(e){ if(e.target.classList.contains('click')) return; toggleExpand(tr, r); });
  });
  updateFoot(rows.length);

  // 十字高亮
  const table = document.getElementById('board');
  table.querySelectorAll('tbody tr').forEach(tr=>{
    tr.addEventListener('mouseover', e=>{
      const cell = e.target.closest('td'); if(!cell) return;
      const idx = cell.cellIndex;
      tbody.querySelectorAll('td').forEach(c=>c.classList.remove('hl-row','hl-col'));
      tr.querySelectorAll('td').forEach(c=>c.classList.add('hl-row'));
      table.querySelectorAll('tbody tr').forEach(row=>{ const c=row.cells[idx]; if(c) c.classList.add('hl-col'); });
    });
    tr.addEventListener('mouseleave', ()=>{
      tbody.querySelectorAll('td').forEach(c=>c.classList.remove('hl-row','hl-col'));
    });
  });

  // 按潜伏配债 skill 模板即时生成单页并打开新标签
  const BOARD_TITLE_MAP = {'上海主板':'沪市主板','深圳主板':'深市主板','创业板':'深市创业板','科创板':'沪市科创板'};
  function openSingle(d){
    let h = TEMPLATE;
    // 标题明确沪市/深市 + 板块
    h = h.replace(/{{BOARD_TITLE}}/g, BOARD_TITLE_MAP[d.board] || d.board);
    h = h.replace(/{{stockName}}/g, d.name || '');
    // 参数填充：上市价默认采用激进价
    const map = {code:d.code, name:d.name, bondName:d.bond, price:(d.rtPrice!=null?d.rtPrice:d.price), perShare:d.perShare,
      regDate:d.reg, payDate:d.pay, issueSize:d.issue, rating:d.rating, convPrice:d.conv,
      listingPrice:d.aggrPrice || '157.3', lockShares:d.lockShares || '', lockRatio:'100',
      floatScale:(d.fs === null || d.fs === undefined || d.fs === '') ? '' : d.fs};
    for (const id in map){
      const re = new RegExp('<input id="'+id+'"[^>]*?value="[^"]*"', 'g');
      h = h.replace(re, '<input id="'+id+'" value="'+map[id]+'"');
    }
    h = h.replace(/id="tableDateValue">—</, 'id="tableDateValue">'+GEN_DATE+'<');

    // 预计算全档位结果并静态写入 HTML：打开即见，不依赖浏览器 JS 执行时机
    const TIERS = [100,200,300,400,500,600,700,800,900,1000,2000,3000,4000];
    function fmt(n, dp){
      if (!isFinite(n)) return '—';
      return Number(n).toLocaleString('zh-CN', { minimumFractionDigits:dp, maximumFractionDigits:dp });
    }
    function ratingFor(c){
      if (c >= 9) return { stars:'★★★★★', label:'极致优质', cls:'r5' };
      if (c >= 7) return { stars:'★★★★',   label:'优质稳健', cls:'r4' };
      if (c >= 4) return { stars:'★★★',    label:'中性博弈', cls:'r3' };
      if (c >= 2) return { stars:'★★',     label:'风险偏弱', cls:'r2' };
      return        { stars:'★',       label:'极致垃圾', cls:'r1' };
    }
    const P = parseFloat(d.price) || 0;
    const A = parseFloat(d.perShare) || 0;
    const noScheme = !(A > 0);   // 方案未定（无每股配售）→ 获配/安全垫用横杠，不误导
    const L = parseFloat(d.aggrPrice) || 157.3;
    const profitPerBond = L - 100;
    const theoCushion = (P > 0 && A > 0) ? (A * profitPerBond) / P : null;
    const head = noScheme ? null : ratingFor(theoCushion);
    h = h.replace(/id="profitPerBond">—</, 'id="profitPerBond">'+(noScheme?'—':fmt(profitPerBond,1)+' 元')+'<');
    h = h.replace(/id="theoCushion">—</, 'id="theoCushion">'+(noScheme?'—':fmt(theoCushion,2)+'%')+'<');
    h = h.replace(/id="headlineStars">—</, 'id="headlineStars">'+(noScheme?'—':head.stars)+'<');
    h = h.replace(/id="headlineLabel">—</, 'id="headlineLabel">'+(noScheme?'方案未定':head.label)+'<');
    h = h.replace(/id="headlineCushion">—</, 'id="headlineCushion">'+(noScheme?'—':fmt(theoCushion,2)+'%')+'<');
    let rowsHtml = '';
    TIERS.forEach(function(N){
      const cost = N * P;
      const theo = noScheme ? null : N * A;
      const actual = noScheme ? null : ((String(d.code)[0] === '6') ? Math.floor(theo / 1000) * 1000 : Math.floor(theo / 100) * 100); // 沪市按手(1000)取整，深市按张(100)取整
      const profit = noScheme ? null : (actual / 100) * profitPerBond;
      const cushion = (noScheme || cost <= 0) ? null : profit / cost * 100;
      const r = cushion == null ? null : ratingFor(cushion);
      rowsHtml +=
        '<tr>' +
        '<td class="tier">' + N + '</td>' +
        '<td class="num">' + fmt(cost, 0) + '</td>' +
        '<td class="num">' + (noScheme ? '—' : fmt(theo, 2)) + '</td>' +
        '<td class="num">' + (noScheme ? '—' : fmt(actual, 0)) + '</td>' +
        '<td class="num">' + (noScheme ? '—' : fmt(profit, 2)) + '</td>' +
        '<td class="cushion">' + (noScheme ? '—' : fmt(cushion, 2) + '%') + '</td>' +
        '<td class="stars ' + (r ? r.cls : '') + '">' + (noScheme ? '—' : r.stars) + '</td>' +
        '<td class="' + (r ? r.cls : '') + '">' + (noScheme ? '—' : r.label) + '</td>' +
        '</tr>';
    });
    h = h.replace(
      /<tbody id="tierBody" class="num-tabular">[\s\S]*?<\/tbody>/,
      '<tbody id="tierBody" class="num-tabular">' + rowsHtml + '</tbody>'
    );

    const blob = new Blob([h], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }

  // 点击代码联动生成单页（正式：按潜伏配债 skill 模板即时生成并打开新标签）
  tbody.querySelectorAll('.click').forEach(c=>{
    c.addEventListener('click', function(){
      const code = c.getAttribute('data-code');
      const d = BYCODE[code];
      if (d) openSingle(d);
    });
  });
}

const avg = (DATA.reduce((s,d)=>s+(d.optimalCushionCons||0),0)/DATA.length*100).toFixed(2);
function updateFoot(shown){
  document.getElementById('foot').innerHTML =
    '当前显示 '+(shown!=null?shown:DATA.length)+' 只｜总计 '+DATA.length+' 只 ｜ 平均最优档保守安全垫 '+avg+'% ｜ 行情每日早晚由集思录+腾讯刷新，交易时段叠加浏览器端实时行情（东财/腾讯双源）｜ 上市价按保守/激进模型价估算，可在单页测算中自定义 ｜ 安全垫/含权量为理论值，小仓位因碎面损耗实际更低 ｜ 可流通规模=发行规模−锁定股东持股×每股配售÷1e8（持股≥5%/实控人/一致行动人 6 个月锁定）';
}

document.getElementById('filterStage').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);
document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') doSearch(); });
document.getElementById('viewTabs').addEventListener('click', function(e){
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  viewMode = btn.getAttribute('data-mode');
  this.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});
render();
updateFoot();

// ===== 实时行情模块：交易时段浏览器端自动刷新（腾讯 qt.gtimg 主源 + 东财 push2 兜底）=====
;(function(){
  if (typeof DATA === 'undefined' || !DATA || !DATA.length) return;
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  function isTradingNow(){
    var now = new Date();
    var utc = now.getTime() + now.getTimezoneOffset() * 60000;
    var bj = new Date(utc + 8 * 3600000);
    var day = bj.getDay();
    if (day === 0 || day === 6) return false;
    var t = bj.getHours() * 60 + bj.getMinutes();
    return (t >= 9 * 60 + 15 && t <= 11 * 60 + 30) || (t >= 13 * 60 && t <= 15 * 60);
  }
  function jsonp(url, cbName, timeout){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      var cb = cbName + '_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      var timer = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, timeout || 6000);
      function cleanup(){ clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function(data){ cleanup(); resolve(data); };
      s.onerror = function(){ cleanup(); reject(new Error('script error')); };
      s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + cb;
      document.head.appendChild(s);
    });
  }
  // 腾讯 qt.gtimg：轮询探测式（消灭 onload 偶发挂死），一次拉全部代码
  function fetchTX(){
    return new Promise(function(resolve, reject){
      var codes = DATA.map(function(d){ return (d.code[0] === '6' ? 'sh' : 'sz') + d.code; });
      var s = document.createElement('script');
      var TIMEOUT = 4500;
      var start = Date.now();
      var settled = false;
      function finish(ok, reason){
        if (settled) return; settled = true;
        clearInterval(poll); clearTimeout(fail);
        if (s.parentNode) s.parentNode.removeChild(s);
        if (ok) resolve(ok); else reject(new Error(reason));
      }
      var poll = setInterval(function(){
        var out = {};
        for (var i = 0; i < codes.length; i++){
          var raw = window['v_' + codes[i]];
          if (!raw) continue;
          var p = raw.split('~');
          var price = parseFloat(p[3]);
          if (!isFinite(price) || price <= 0) continue;
          var prev = parseFloat(p[4]) || price;
          out[codes[i].slice(2)] = { price: price, gainPct: prev > 0 ? (price - prev) / prev * 100 : 0 };
        }
        if (Object.keys(out).length) return finish(out);
        if (Date.now() - start > TIMEOUT) return finish(null, 'tx timeout');
      }, 120);
      var fail = setTimeout(function(){ finish(null, 'tx timeout'); }, TIMEOUT + 600);
      s.onerror = function(){ finish(null, 'tx error'); };
      s.src = 'https://qt.gtimg.cn/q=' + codes.join(',');
      document.head.appendChild(s);
    });
  }
  // 东财 push2 兜底（JSONP）
  function fetchEM(){
    var secids = DATA.map(function(d){ return (d.code[0] === '6' ? '1.' : '0.') + d.code; }).join(',');
    var url = 'https://push2.eastmoney.com/api/qt/ulist.np/get?ut=fa5fd1943c7b386f172d6893dbfba10b&invt=2&fltt=2&secids=' + encodeURIComponent(secids) + '&fields=f2,f3,f4';
    return jsonp(url, 'emcb').then(function(data){
      if (!data || data.rc !== 0 || !data.data || !data.data.diff) throw new Error('em empty');
      var out = {};
      for (var k in data.data.diff){
        var it = data.data.diff[k];
        var price = parseFloat(it.f2);
        if (!isFinite(price) || price <= 0) continue;
        var code = k.indexOf('.') >= 0 ? k.split('.')[1] : k;
        out[code] = { price: price, gainPct: parseFloat(it.f3) };
      }
      if (!Object.keys(out).length) throw new Error('em no price');
      return out;
    });
  }
  function cushStars(c){ return c >= 0.09 ? 5 : c >= 0.07 ? 4 : c >= 0.04 ? 3 : c >= 0.02 ? 2 : 1; }
  function lfmt(n, dp){ return Number(n).toFixed(dp); }
  function applyLive(map){
    for (var i = 0; i < DATA.length; i++){
      var d = DATA[i];
      var lv = map[d.code];
      if (!lv) continue;
      d.rtPrice = lv.price;
      d.tableGain = (lv.price - d.price) / d.price;
      var cost = (d.optimalShares || 0) * lv.price;
      var profitCons = (d.optimalActual / 100) * (d.consPrice - 100);
      var profitAggr = (d.optimalActual / 100) * (d.aggrPrice - 100);
      d.optimalCost = cost;
      d.optimalCushionCons = cost > 0 ? profitCons / cost : 0;
      d.optimalCushionAggr = cost > 0 ? profitAggr / cost : 0;
    }
    updateDom();
  }
  function updateDom(){
    var tbody = document.getElementById('tbody');
    if (!tbody) return;
    var cells = tbody.querySelectorAll('[data-code]');
    var trading = isTradingNow();
    for (var i = 0; i < cells.length; i++){
      var cell = cells[i];
      var code = cell.getAttribute('data-code');
      var d = BYCODE[code];
      if (!d) continue;
      var tr = cell.closest('tr');
      if (!tr) continue;
      var c = tr.cells;
      if (c[9]){
        c[9].textContent = lfmt(d.rtPrice, 2);
        // 交易时段价格变动闪烁（涨红跌绿）
        if (trading && d._prevRt != null && Math.abs(d.rtPrice - d._prevRt) >= 0.005){
          var cls = d.rtPrice > d._prevRt ? 'cell-flash-up' : 'cell-flash-down';
          c[9].classList.remove('cell-flash-up', 'cell-flash-down');
          void c[9].offsetWidth;
          c[9].classList.add(cls);
        }
        d._prevRt = d.rtPrice;
      }
      if (c[10]){ c[10].textContent = lfmt(d.tableGain * 100, 2) + '%'; c[10].className = 'num ' + (d.tableGain >= 0 ? 'rate4' : 'rate1'); }
      if (c[16]){ var sc = cushStars(d.optimalCushionCons); c[16].innerHTML = lfmt(d.optimalCushionCons * 100, 2) + '%<br><span class="star-mark">' + '★'.repeat(sc) + '</span>'; }
      if (c[18]){ var sa = cushStars(d.optimalCushionAggr); c[18].innerHTML = lfmt(d.optimalCushionAggr * 100, 2) + '%<br><span class="star-mark">' + '★'.repeat(sa) + '</span>'; }
      if (c[19]) c[19].textContent = lfmt(d.optimalCost, 0);
    }
  }
  var lastOk = false;
  function setStatus(text){ var el = document.getElementById('priceDate'); if (el) el.textContent = text; }
  function tick(){
    // 腾讯主源 → 东财兜底；无论交易与否都先拉一次（收盘后=今收，盘中=实时tick）
    fetchTX().catch(function(){ return fetchEM(); }).then(function(map){
      applyLive(map);
      lastOk = true;
      var t = new Date();
      var tag = isTradingNow() ? '● 实时行情（腾讯 · 3s 刷新）' : '● 收盘行情（已锁定今收）';
      setStatus(tag + ' · 最后更新 ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()));
    }).catch(function(e){
      setStatus(lastOk ? '○ 实时行情暂时获取失败，沿用最近快照（将自动重试）' : '○ 实时行情获取失败（将自动重试）');
      if (window.console) console.warn('[实时行情]', e && e.message);
    });
  }
  tick(); // 加载即拉（无论交易与否）
  setInterval(function(){ if (isTradingNow()) tick(); }, 3000); // 仅交易时段轮询（3s）
})();
</script>
