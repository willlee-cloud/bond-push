name: 可转债上市提醒 - 每日推送

on:
  schedule:
    # GitHub Actions 用 UTC 时间。北京时间 08:xx = UTC 00:xx
    # 改用冷门分钟（17/37/57）替代整点/半点，避免 GitHub 免费版高峰丢弃。
    # 4 次冗余覆盖北京时间 08:10-09:25 早盘窗口；mark-notified 去重，不重复推。
    - cron: '17 0 * * *'   # UTC 00:17 = 北京 08:17
    - cron: '37 0 * * *'   # UTC 00:37 = 北京 08:37
    - cron: '57 0 * * *'   # UTC 00:57 = 北京 08:57
    - cron: '17 1 * * *'   # UTC 01:17 = 北京 09:17（兜底，开盘前最后一次）
  workflow_dispatch:      # 允许在网页上手动点「Run workflow」立即测试
    inputs:
      force:
        description: '强制推送（忽略上市日判断，用于测试）'
        required: false
        default: 'false'

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行推送脚本
        env:
          PA_BASE: ${{ secrets.PA_BASE }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
          DAILY_PUSH_FORCE: ${{ github.event.inputs.force }}
        run: python daily_push.py
